name: Gmail Backup Cloud

on:
  workflow_dispatch:
  # Activación autónoma adicional: el cron de GitHub puede omitir horarios,
  # WeatherLink aporta disparos frecuentes sin alterar el ciclo de niveles.
  workflow_run:
    workflows:
      - 'WeatherLink Cloud - 32 estaciones'
      - 'WeatherLink Rescue - independiente'
    types: [completed]
  push:
    branches:
      - main
    paths:
      - 'src/gmail_fallback.py'
      - 'src/fuente2_niveles.py'
      - 'src/auditar_productos_operativos.py'
      - '.github/workflows/gmail-backup-cloud.yml'
  schedule:
    # Arranque autónomo Tabasco UTC-6: el primer boletín suele llegar a las 06:20–06:30.
    # Consultas tempranas independientes del recolector principal de las 06:50.
    # Varios disparos reducen dependencia de un único cron que GitHub puede demorar.
    # Recuperación operativa 27-sep: activar ejecución directa para verificar boletín 08:00.
    - cron: '35,45 12 * * *' # 06:35 y 06:45
    - cron: '5,35 13 * * *'  # 07:05 y 07:35, recuperación matutina
    # Horarios anteriores intactos; el histórico de ID y SHA impide duplicaciones.
    - cron: '40 12-23,0 * * *' # 06:40–18:40: revisar boletines recibidos alrededor de :20–:36
    - cron: '50 12-23,0 * * *' # 06:50–18:50, conservar respaldo existente
    - cron: '15 13-23,0-1 * * *' # 07:15–19:15, recuperación posterior

permissions:
  contents: write

# Misma cola de escritura que niveles principal y sus dos recuperadores.
# Impide procesar/publicar simultáneamente los mismos históricos y Word.
# WeatherLink mantiene su propia cola y frecuencia.
concurrency:
  group: datos-hidrometeorologicos-writer
  cancel-in-progress: false

jobs:
  respaldo-gmail:
    # Sólo operar en ventana diurna de Tabasco, conservar pausa nocturna.
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar configuración Gmail
        id: gmail
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        shell: bash
        run: |
          if [ -n "$GMAIL_USER" ] && [ -n "$GMAIL_PASSWORD" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Respaldo Gmail configurado en GitHub Secrets."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Respaldo Gmail aún no configurado; no se modifica ningún dato."
          fi

      - name: Probar acceso IMAP Gmail sin modificar datos
        if: steps.gmail.outputs.enabled == 'true'
        env:
          GMAIL_BACKUP_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_BACKUP_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        shell: bash
        run: |
          python - <<'PY'
          import imaplib, os
          user=os.environ['GMAIL_BACKUP_USER'].strip()
          password=os.environ['GMAIL_BACKUP_APP_PASSWORD'].replace(' ', '').strip()
          m=imaplib.IMAP4_SSL('imap.gmail.com', 993, timeout=30)
          try:
              m.login(user, password)
              typ, _ = m.select('INBOX', readonly=True)
              if typ != 'OK':
                  raise RuntimeError('Gmail no permitió abrir INBOX')
              print('Autenticación IMAP Gmail correcta; INBOX disponible.')
          finally:
              try: m.logout()
              except Exception: pass
          PY

      - name: Configurar Python
        if: steps.gmail.outputs.enabled == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Configurar Node
        if: steps.gmail.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias Python
        if: steps.gmail.outputs.enabled == 'true'
        run: pip install -r requirements.txt

      - name: Instalar dependencias Node
        if: steps.gmail.outputs.enabled == 'true'
        run: npm install --no-audit --no-fund

      - name: Consultar Gmail y procesar sólo información más nueva
        if: steps.gmail.outputs.enabled == 'true'
        env:
          GMAIL_BACKUP_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_BACKUP_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_BACKUP_LOOKBACK_DAYS: '3'
          NIVELES_BASE: data/niveles
          CARBONIO_USER: gmail-backup-unused
          CARBONIO_PASSWORD: gmail-backup-unused
        run: python src/gmail_fallback.py

      - name: Verificar resultado Gmail antes de continuar
        if: steps.gmail.outputs.enabled == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/niveles/Estado_Gmail_Backup.json')
          if not p.exists():
              raise SystemExit('Falta Estado_Gmail_Backup.json después de consultar Gmail')
          s=json.loads(p.read_text(encoding='utf-8'))
          if not s.get('configured'):
              raise SystemExit('El proceso Gmail no quedó configurado')
          errs=s.get('errors') or []
          if errs:
              raise SystemExit(f'Gmail reportó errores: {errs}')
          print('Gmail verificado:', s.get('messages_scanned'), 'mensajes PDF revisados;',
                s.get('levels_processed_now'), 'niveles nuevos;',
                'fuentes actualizadas:', s.get('sources_updated'))
          PY

      - name: Revalidar FUENTE2 vigente sin crear duplicados
        if: steps.gmail.outputs.enabled == 'true'
        shell: bash
        run: |
          set -e
          if [ -f data/latest/FUENTE2.txt ]; then
            python src/fuente2_niveles.py
          fi

      - name: Detectar si Gmail aportó información operativa nueva
        id: aporte
        if: steps.gmail.outputs.enabled == 'true'
        shell: bash
        run: |
          set -e
          if git diff --quiet -- \
              data/latest \
              data/archive \
              data/niveles/Historico \
              data/niveles/Estado/mensajes_gmail_procesados.txt \
              data/niveles/Estado/pdf_gmail_procesados_sha256.txt; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Gmail no aportó un corte operativo nuevo. No se regeneran productos."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Gmail aportó información nueva verificada; se regeneran derivados."
          fi

      - name: Incorporar FUENTE2 y regenerar productos derivados
        if: steps.gmail.outputs.enabled == 'true' && steps.aporte.outputs.changed == 'true'
        shell: bash
        run: |
          set -e
          python src/fuente2_niveles.py
          python src/extraer_clima_boletines.py
          python src/niveles_postprocess.py
          python src/resumen_12h_niveles.py
          python src/generar_word_niveles.py

      - name: Auditar valores antes de publicar respaldo
        if: steps.gmail.outputs.enabled == 'true' && steps.aporte.outputs.changed == 'true'
        run: python src/auditar_productos_operativos.py

      - name: Publicar hora de revisión Gmail aunque no exista boletín nuevo
        if: steps.gmail.outputs.enabled == 'true' && steps.aporte.outputs.changed != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Agente Hidrometeorologico Gmail Backup"
          git config user.email "actions@users.noreply.github.com"
          cp data/niveles/Estado_Gmail_Backup.json /tmp/estado-gmail.json
          for intento in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/estado-gmail.json data/niveles/Estado_Gmail_Backup.json
            git add data/niveles/Estado_Gmail_Backup.json
            if git diff --cached --quiet; then
              echo "Revisión Gmail ya incorporada."
              exit 0
            fi
            git commit -m "Actualiza revisión Gmail de niveles [skip ci]"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((intento * 5))
          done
          exit 1

      - name: Publicar respaldo Gmail sin conflictos ni retrocesos
        if: steps.gmail.outputs.enabled == 'true' && steps.aporte.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Agente Hidrometeorologico Gmail Backup"
          git config user.email "actions@users.noreply.github.com"
          PRODUCTOS=(
            data/latest data/archive
            data/niveles/Historico data/niveles/Resumen_12h
            data/niveles/Ultimo_Corte data/niveles/Estado
            data/niveles/Estado_Gmail_Backup.json
            data/niveles/Clima_CONAGUA data/niveles/Auditoria
            data/niveles/Graficas data/niveles/Reportes
          )
          # Conservar los productos ya auditados; nunca rebase de JSON/Word binarios.
          tar -cf /tmp/gmail-productos.tar "${PRODUCTOS[@]}"
          cp data/niveles/Ultimo_Corte/ultimo_resumen.json /tmp/gmail-candidato.json
          for intento in 1 2 3 4; do
            echo "Publicación Gmail ${intento}/4"
            git fetch origin main
            git reset --hard origin/main
            # Otra ejecución podría haber publicado un corte posterior:
            # comparar fechas reales de observación, no horas de ejecución.
            if python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          def cutoff(path):
              try:
                  rows=json.loads(Path(path).read_text(encoding='utf-8'))
                  return max(datetime.fromisoformat(r['fecha_hora']) for r in rows if r.get('fecha_hora'))
              except (OSError, ValueError, KeyError, TypeError):
                  return None
          candidate=cutoff('/tmp/gmail-candidato.json')
          current=cutoff('data/niveles/Ultimo_Corte/ultimo_resumen.json')
          print('Corte Gmail:',candidate,'corte remoto:',current)
          if candidate is None or (current is not None and candidate<=current):
              raise SystemExit(0)
          raise SystemExit(1)
          PY
            then
              echo "Corte igual, posterior o candidato no válido: se conserva el remoto; no se retrocede."
              exit 0
            fi
            tar -xf /tmp/gmail-productos.tar
            git add "${PRODUCTOS[@]}"
            if git diff --cached --quiet; then
              echo "Productos ya incorporados."
              exit 0
            fi
            git commit -m "Actualiza respaldo Gmail cloud [skip ci]"
            if git push origin HEAD:main; then
              echo "Respaldo Gmail publicado."
              exit 0
            fi
            sleep $((intento * 5))
          done
          echo "No fue posible publicar Gmail después de 4 intentos."
          exit 1
