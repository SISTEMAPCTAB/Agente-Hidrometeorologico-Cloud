name: Gmail Backup Cloud

on:
  # Programación: Cloudflare Worker despachador-hidro (cloudflare/despachador-hidro/worker.js, tabla JOBS).
  # Sin cron de GitHub: el cron de Actions retrasa o pierde corridas. Para cambiar el horario, editar JOBS.
  workflow_dispatch:
  # Único flujo de revisión de Gmail (lo lanza el Worker). Los recuperadores de niveles quedan manuales,
  # para que esta revisión no espere detrás de trabajos redundantes en la misma cola.
  # Un cambio en este workflow también fuerza una revalidación inmediata de cortes pendientes.
  push:
    branches:
      - main
    paths:
      - 'src/gmail_fallback.py'
      - 'src/fuente2_niveles.py'
      - 'src/auditar_productos_operativos.py'
      - '.github/workflows/gmail-backup-cloud.yml'
      - 'data/control/gmail-trigger.txt'

permissions:
  contents: write

# Misma cola de escritura que niveles principal y sus dos recuperadores.
# Impide procesar/publicar simultáneamente los mismos históricos y Word.
# WeatherLink mantiene su propia cola y frecuencia.
concurrency:
  group: niveles-hidrometricos-cloud
  cancel-in-progress: false

jobs:
  respaldo-gmail:
    # Respaldo independiente: sólo su propio horario, control o ejecución manual.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Registrar verificación de Gmail
        run: echo "Gmail backup disparo=${{ github.event_name }} fecha_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar configuración Gmail
        id: gmail
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        shell: bash
        run: |
          if [ -n "$GMAIL_USER" ] && [ -n "$GMAIL_PASSWORD" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Respaldo Gmail configurado en GitHub Secrets."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Respaldo Gmail aún no configurado; no se modifica ningún dato."
          fi

      # La conexión IMAP y sus reintentos se verifican en gmail_fallback.py;
      # evitar una segunda conexión preliminar que puede agotar el workflow.

      - name: Configurar Python
        if: steps.gmail.outputs.enabled == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Configurar Node
        if: steps.gmail.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias Python
        if: steps.gmail.outputs.enabled == 'true'
        run: pip install -r requirements.txt

      - name: Instalar dependencias Node
        if: steps.gmail.outputs.enabled == 'true'
        run: npm install --no-audit --no-fund

      - name: Consultar Gmail y procesar sólo información más nueva
        if: steps.gmail.outputs.enabled == 'true'
        env:
          GMAIL_BACKUP_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_BACKUP_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_BACKUP_LOOKBACK_DAYS: '3'
          NIVELES_BASE: data/niveles
          CARBONIO_USER: gmail-backup-unused
          CARBONIO_PASSWORD: gmail-backup-unused
        run: python src/gmail_fallback.py

      - name: Verificar resultado Gmail antes de continuar
        if: steps.gmail.outputs.enabled == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/niveles/Estado_Gmail_Backup.json')
          if not p.exists():
              raise SystemExit('Falta Estado_Gmail_Backup.json después de consultar Gmail')
          s=json.loads(p.read_text(encoding='utf-8'))
          if not s.get('configured'):
              raise SystemExit('El proceso Gmail no quedó configurado')
          errs=s.get('errors') or []
          if errs:
              raise SystemExit(f'Gmail reportó errores: {errs}')
          print('Gmail verificado:', s.get('messages_scanned'), 'mensajes PDF revisados;',
                s.get('levels_processed_now'), 'niveles nuevos;',
                'fuentes actualizadas:', s.get('sources_updated'))
          PY

      - name: Revalidar FUENTE2 vigente sin crear duplicados
        if: steps.gmail.outputs.enabled == 'true'
        shell: bash
        run: |
          set -e
          if [ -f data/latest/FUENTE2.txt ]; then
            python src/fuente2_niveles.py
          fi

      - name: Detectar si Gmail aportó información operativa nueva
        id: aporte
        if: steps.gmail.outputs.enabled == 'true'
        shell: bash
        run: |
          set -e
          if git diff --quiet -- \
              data/latest \
              data/archive \
              data/niveles/Historico \
              data/niveles/Estado/mensajes_gmail_procesados.txt \
              data/niveles/Estado/pdf_gmail_procesados_sha256.txt; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Gmail no aportó un corte operativo nuevo. No se regeneran productos."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Gmail aportó información nueva verificada; se regeneran derivados."
          fi

      - name: Incorporar FUENTE2 y regenerar productos derivados
        if: steps.gmail.outputs.enabled == 'true' && steps.aporte.outputs.changed == 'true'
        shell: bash
        run: |
          set -e
          python src/fuente2_niveles.py
          python src/extraer_clima_boletines.py
          python src/niveles_postprocess.py
          python src/resumen_12h_niveles.py
          python src/generar_word_niveles.py

      - name: Auditar valores antes de publicar respaldo
        if: steps.gmail.outputs.enabled == 'true' && steps.aporte.outputs.changed == 'true'
        run: python src/auditar_productos_operativos.py

      - name: Publicar hora de revisión Gmail aunque no exista boletín nuevo
        if: steps.gmail.outputs.enabled == 'true' && steps.aporte.outputs.changed != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Agente Hidrometeorologico Gmail Backup"
          git config user.email "actions@users.noreply.github.com"
          cp data/niveles/Estado_Gmail_Backup.json /tmp/estado-gmail.json
          for intento in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            if python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime
          def stamp(p):
              try:return datetime.fromisoformat(json.loads(Path(p).read_text())['run_local'])
              except (OSError,ValueError,KeyError,TypeError):return None
          a=stamp('/tmp/estado-gmail.json'); b=stamp('data/niveles/Estado_Gmail_Backup.json')
          raise SystemExit(0 if a is None or (b and b>=a) else 1)
          PY
            then
              echo "Revisión Gmail igual o más reciente ya publicada."
              exit 0
            fi
            cp /tmp/estado-gmail.json data/niveles/Estado_Gmail_Backup.json
            git add data/niveles/Estado_Gmail_Backup.json
            if git diff --cached --quiet; then
              echo "Revisión Gmail ya incorporada."
              exit 0
            fi
            git commit -m "Actualiza revisión Gmail de niveles [skip ci]"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((intento * 5))
          done
          exit 1

      - name: Publicar respaldo Gmail sin conflictos ni retrocesos
        if: steps.gmail.outputs.enabled == 'true' && steps.aporte.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Agente Hidrometeorologico Gmail Backup"
          git config user.email "actions@users.noreply.github.com"
          PRODUCTOS=(
            data/latest data/archive
            data/niveles/Historico data/niveles/Resumen_12h
            data/niveles/Ultimo_Corte data/niveles/Estado
            data/niveles/Estado_Gmail_Backup.json
            data/niveles/Clima_CONAGUA data/niveles/Auditoria
            data/niveles/Graficas data/niveles/Reportes
            data/niveles/Horario_Bifurcacion
            data/niveles/Lluvia_CONAGUA
          )
          tar -cf /tmp/gmail-productos.tar "${PRODUCTOS[@]}"
          cp data/niveles/Ultimo_Corte/ultimo_resumen.json /tmp/gmail-candidato.json
          cp data/niveles/Estado_Gmail_Backup.json /tmp/gmail-estado-candidato.json
          for source in FUENTE1 FUENTE2; do
            if [ -f "data/latest/${source}.txt" ]; then
              cp "data/latest/${source}.txt" "/tmp/gmail-${source}.txt"
            fi
          done
          for intento in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            if python - <<'PY'
          import json,re
          from pathlib import Path
          from datetime import datetime,timezone
          def source_time(path):
              try:
                  m=re.search(r'^FECHA/HORA MENSAJE:\s*(.+)$',Path(path).read_text(encoding='utf-8'),re.M)
                  return datetime.fromisoformat(m.group(1).strip()).astimezone(timezone.utc) if m else None
              except (OSError,ValueError):return None
          def cutoff(path):
              try:
                  rows=json.loads(Path(path).read_text(encoding='utf-8'))
                  return max(datetime.fromisoformat(r['fecha_hora']).astimezone(timezone.utc) for r in rows if r.get('fecha_hora'))
              except (OSError,ValueError,KeyError,TypeError):return None
          candidate=cutoff('/tmp/gmail-candidato.json')
          current=cutoff('data/niveles/Ultimo_Corte/ultimo_resumen.json')
          updates=[]
          for source in ('FUENTE1','FUENTE2'):
              a=source_time('/tmp/gmail-'+source+'.txt')
              b=source_time('data/latest/'+source+'.txt')
              if a and (not b or a>b):updates.append(source)
          print('Cortes Gmail/remoto:',candidate,current,'fuentes nuevas:',updates)
          # Corte hidrométrico publicado nunca debe regresar ni ser sobrescrito
          # por productos procesados con un boletín igual o anterior.
          raise SystemExit(0 if candidate is None or (current and candidate<=current) else 1)
          PY
            then
              echo "Corte hidrométrico ya publicado; actualizar únicamente hora real de consulta Gmail."
              if python3 - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime
          def stamp(p):
              try:return datetime.fromisoformat(json.loads(Path(p).read_text())['run_local'])
              except (OSError,ValueError,KeyError,TypeError):return None
          a=stamp('/tmp/gmail-estado-candidato.json')
          b=stamp('data/niveles/Estado_Gmail_Backup.json')
          raise SystemExit(0 if a is not None and (b is None or a>b) else 1)
          PY
              then
                cp /tmp/gmail-estado-candidato.json data/niveles/Estado_Gmail_Backup.json
                git add data/niveles/Estado_Gmail_Backup.json
                if git diff --cached --quiet; then exit 0; fi
                git commit -m "Actualiza estado real Gmail sin alterar cortes [skip ci]"
                if git push origin HEAD:main; then exit 0; fi
                sleep $((intento * 5))
                continue
              fi
              echo "La revisión remota Gmail es igual o posterior; no retroceder."
              exit 0
            fi
            tar -xf /tmp/gmail-productos.tar
            git add "${PRODUCTOS[@]}"
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Actualiza respaldo Gmail cloud [skip ci]"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((intento * 5))
          done
          echo "Publicación Gmail falló tras cuatro intentos."
          exit 1

      # CFE · funcionamiento de vasos (Peñitas, Juan de Grijalva, Malpaso). Paso independiente al final:
      # si falla, no afecta niveles ni boletines. Sólo publica data/cfe_vasos (sin el Excel).
      - name: CFE funcionamiento de vasos (Peñitas)
        if: always() && steps.gmail.outputs.enabled == 'true'
        continue-on-error: true
        timeout-minutes: 5
        env:
          GMAIL_BACKUP_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_BACKUP_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        shell: bash
        run: |
          set -uo pipefail
          pip install -q openpyxl==3.1.5
          git fetch -q origin main && git reset -q --hard origin/main
          python src/cfe_vasos.py
          git config user.name "Agente Hidrometeorologico Gmail Backup"
          git config user.email "actions@users.noreply.github.com"
          [ -d data/cfe_vasos ] || exit 0
          tar -cf /tmp/cfe-vasos.tar data/cfe_vasos
          for intento in 1 2 3 4; do
            git fetch -q origin main && git reset -q --hard origin/main
            tar -xf /tmp/cfe-vasos.tar
            git add data/cfe_vasos
            if git diff --cached --quiet; then echo "CFE vasos sin cambios."; exit 0; fi
            git commit -q -m "CFE funcionamiento de vasos [skip ci]"
            if git push -q origin HEAD:main; then exit 0; fi
            sleep $((intento * 5))
          done
          exit 0
