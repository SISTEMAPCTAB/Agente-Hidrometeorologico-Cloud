name: Actualizar gastos CONAGUA del modelo (aislado)
on:
  # Programación: Cloudflare Worker despachador-hidro (cloudflare/despachador-hidro/worker.js, tabla JOBS).
  # Sin cron de GitHub: el cron de Actions retrasa o pierde corridas. Para cambiar el horario, editar JOBS.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/latest/FUENTE1.txt'
      - 'data/latest/FUENTE2.txt'
      - 'src/extraer_gastos_modelo.py'
      - '.github/workflows/gastos-modelo.yml'
permissions:
  contents: write
concurrency:
  group: gastos-modelo-aislado
  cancel-in-progress: false
jobs:
  publicar-gastos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recalcular sobre las fuentes más recientes y publicar solamente gastos
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Agente Gastos CONAGUA"
          git config user.email "actions@users.noreply.github.com"
          for intento in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            python3 src/extraer_gastos_modelo.py
            python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/pronostico_hidrologico/gastos_conagua.json').read_text())
          assert len(d['estaciones']) == 13
          for nombre in ('Salto de Agua', 'Macuspana'):
              x=next(t for t in d['estaciones'] if t['estacion']==nombre)
              assert x['q_actual_m3s'] is not None, 'Falta gasto actual '+nombre
              assert x['validacion']=='fuente2_layout_columnas_actual_gasto' or x['fuente_fecha_hora'], 'Falta fuente '+nombre
          p=next(x for x in d['estaciones'] if x['estacion']=='Peñitas')
          assert p['q_actual_m3s'] != 0.04, 'Se detectó la columna incorrecta de FUENTE2'
          assert d['fuente1_fecha_hora'], 'FUENTE1 sin fecha'
          from datetime import datetime
          from math import isfinite
          validos=[x for x in d['estaciones'] if x.get('q_actual_m3s') is not None]
          assert validos, 'No hay gastos validos'
          for x in validos:
              q=x['q_actual_m3s']
              assert isinstance(q,(int,float)) and isfinite(q) and 0<=q<=20000, 'Gasto invalido: '+x['estacion']
              assert x.get('fuente_fecha_hora'), 'Gasto sin fecha fuente: '+x['estacion']
          fuentes=[datetime.fromisoformat(x['fuente_fecha_hora']) for x in validos]
          assert min(fuentes).tzinfo is not None, 'Gasto sin zona horaria'
          print('Gastos auditados:',len(validos),'fuente reciente:',max(fuentes).isoformat(),'Peñitas:',p['q_actual_m3s'])
          PY
            git add data/pronostico_hidrologico/gastos_conagua.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Actualizar gastos CONAGUA desde boletín más reciente [skip ci]"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((intento * 3))
          done
          exit 1
