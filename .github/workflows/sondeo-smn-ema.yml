name: Sondeo SMN EMA (temporal)
on:
  workflow_dispatch:
jobs:
  sondeo:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Analizar páginas EMA del SMN
        run: |
          mkdir -p s; cd s
          B=https://smn.conagua.gob.mx/tools
          echo "=== capas"
          grep -oE '.{0,200}ConsultaCapas.{0,500}' <(curl -sL -m 40 "$B/JS/EMAS_v2.js") | head -3
          echo "=== cluster sin clave"; curl -sL -m 60 -A "Mozilla/5.0" "$B/PHP/ConsultaCapas.php?tipo=EMAS" -o c0.json; wc -c c0.json; head -c 600 c0.json; echo
          python3 - <<'PY'
          import json
          try: d=json.load(open('c0.json'))
          except Exception as e: print('no json',e); d=[]
          print('n',len(d)); 
          if d: print('campos',list(d[0]))
          for x in d:
              try: la,lo=float(x['latitud']),float(x['longitud'])
              except: continue
              if 15.5<=la<=19 and -93.6<=lo<=-89.5: print('EST',x.get('id_estacion'),x.get('nombre') or x.get('name'),la,lo,{k:v for k,v in x.items() if k not in('latitud','longitud','id_estacion','nombre')})
          PY
          for ID in 122 21 740 539; do
            echo "=== id=$ID 1s"; curl -sL -m 60 -A "Mozilla/5.0" "$B/GUI/EMAS_reporte_v2.php?id=$ID&formato=txt&tipo=1s" -o r$ID.txt; wc -c r$ID.txt; head -c 1800 r$ID.txt; echo; echo ...; tail -c 600 r$ID.txt; echo
          done
          echo "=== info 122"; curl -sL -m 60 -A "Mozilla/5.0" "$B/PHP/GetInfoEMAS_v2.php?id_estacion=122" | head -c 2500; echo
          exit 0
