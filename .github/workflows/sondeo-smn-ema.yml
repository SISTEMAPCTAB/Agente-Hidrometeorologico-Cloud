name: Sondeo SMN EMA (temporal)
on:
  workflow_dispatch:
jobs:
  sondeo:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Analizar páginas EMA del SMN
        run: |
          mkdir -p s; cd s
          curl -sL -m 40 -A "Mozilla/5.0" -o e.js "https://smn.conagua.gob.mx/tools/JS/EMAS_v2.js"
          echo "=== bloques ajax"; python3 - <<'PY'
          import re
          t=open('e.js',encoding='utf-8',errors='ignore').read()
          for m in re.finditer(r'(GetInfoEMAS_v2|ConsultaCluster|EMAS_reporte_v2|EMAS_zip|GetTablaVariables_v3|GetComboEMA|DescargaArchivo)',t):
              print('---',m.group(1)); print(t[max(0,m.start()-300):m.start()+700].replace('\t',' '))
          PY
