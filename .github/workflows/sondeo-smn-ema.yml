name: Sondeo SMN EMA (temporal)
on:
  workflow_dispatch:
jobs:
  sondeo:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Analizar páginas EMA del SMN
        run: |
          mkdir -p s; cd s
          curl -sL -m 40 -A "Mozilla/5.0" -o e.js "https://smn.conagua.gob.mx/tools/JS/EMAS_v2.js"
          echo "=== tamaño"; wc -c e.js
          echo "=== urls"; grep -oiE '["'"'"'][^"'"'"' ]*\.(php|json|csv|txt|zip|xls[x]?|kml|geojson)[^"'"'"' ]*["'"'"']' e.js | sort -u | head -60
          echo "=== ajax"; grep -oiE '.{0,160}(ajax|\$\.get|getJSON|\.load\(|url *:).{0,240}' e.js | head -40
          echo "=== js completo (primeros 6000)"; head -c 6000 e.js
