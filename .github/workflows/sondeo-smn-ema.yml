name: Sondeo SMN EMA (temporal)
on:
  workflow_dispatch:
jobs:
  sondeo:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Analizar páginas EMA del SMN
        run: |
          mkdir -p s; cd s
          B=https://smn.conagua.gob.mx/tools
          echo "=== capas"; curl -sL -m 40 -A "Mozilla/5.0" "$B/PHP/ConsultaCapas.php?tipo=EMAS" | head -c 1500; echo
          grep -oE '.{0,200}ConsultaCapas.{0,500}' <(curl -sL -m 40 "$B/JS/EMAS_v2.js") | head -3
          echo "=== cluster sin clave"; curl -sL -m 60 -A "Mozilla/5.0" "$B/PHP/ConsultaCluster.php?clave=&tipo=EMAS" -o c0.json; wc -c c0.json; head -c 600 c0.json; echo
          python3 - <<'PY'
          import json
          try: d=json.load(open('c0.json'))
          except Exception as e: print('no json',e); d=[]
          print('n',len(d)); 
          if d: print('campos',list(d[0]))
          for x in d:
              try: la,lo=float(x['latitud']),float(x['longitud'])
              except: continue
              if 15.5<=la<=19 and -93.6<=lo<=-89.5: print('EST',x.get('id_estacion'),x.get('nombre') or x.get('name'),la,lo,{k:v for k,v in x.items() if k not in('latitud','longitud','id_estacion','nombre')})
          PY
          ID=$(python3 -c "
          import json
          d=json.load(open('c0.json'))
          print(next((x['id_estacion'] for x in d if 'alenque' in str(x)),''))" 2>/dev/null)
          echo "=== Palenque id=$ID"
          if [ -n "$ID" ]; then
            curl -sL -m 60 -A "Mozilla/5.0" "$B/GUI/EMAS_reporte_v2.php?id=$ID&formato=txt&tipo=24h" -o r.txt; wc -c r.txt; head -c 2500 r.txt; echo; echo ...; tail -c 800 r.txt
            echo "=== info"; curl -sL -m 60 -A "Mozilla/5.0" "$B/PHP/GetInfoEMAS_v2.php?id_estacion=$ID" | head -c 1500; echo
          fi
          exit 0
