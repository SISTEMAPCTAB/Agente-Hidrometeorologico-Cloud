name: Sondeo SMN EMA (temporal)
on:
  workflow_dispatch:
jobs:
  sondeo:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Analizar páginas EMA del SMN
        run: |
          mkdir -p s; cd s
          B=https://smn.conagua.gob.mx/tools
          echo "=== capas"
          grep -oE '.{0,200}ConsultaCapas.{0,500}' <(curl -sL -m 40 "$B/JS/EMAS_v2.js") | head -3
          echo "=== cluster sin clave"; curl -sL -m 60 -A "Mozilla/5.0" "$B/PHP/ConsultaCapas.php?tipo=EMAS" -o c0.json; wc -c c0.json; head -c 600 c0.json; echo
          python3 - <<'PY'
          import json
          try: d=json.load(open('c0.json'))
          except Exception as e: print('no json',e); d=[]
          print('n',len(d)); 
          if d: print('campos',list(d[0]))
          for x in d:
              try: la,lo=float(x['latitud']),float(x['longitud'])
              except: continue
              if 15.5<=la<=19 and -93.6<=lo<=-89.5: print('EST',x.get('id_estacion'),x.get('nombre') or x.get('name'),la,lo,{k:v for k,v in x.items() if k not in('latitud','longitud','id_estacion','nombre')})
          PY
          echo "=== iconos"; python3 -c "
          import json,collections;d=json.load(open('c0.json'));print(collections.Counter(x['icono'] for x in d))"
          for ID in 122 21; do
            for T in 24h 90d; do echo "=== id=$ID $T"; curl -sL -m 90 -A "Mozilla/5.0" "$B/GUI/EMAS_reporte_v2.php?id=$ID&formato=txt&tipo=$T" -o r.txt; wc -c r.txt; sed -n '8,14p' r.txt; done
            echo "=== tabla $ID"; curl -sL -m 60 -A "Mozilla/5.0" "$B/PHP/GetTablaVariables_v3.php?id_estacion=$ID&tipo=EMAS" | sed 's/<[^>]*>/ /g' | tr -s ' \n' ' ' | head -c 2500; echo
          done
          echo "=== sivea v3"; curl -sL -m 40 -A "Mozilla/5.0" "https://smn.conagua.gob.mx/tools/PHP/sivea_v3/div.php" | head -c 1500; echo
          exit 0
