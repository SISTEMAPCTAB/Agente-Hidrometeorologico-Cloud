name: Carbonio Cloud - boletines diarios

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/carbonio_to_repo.py'
      - 'src/presas_history.py'
      - 'requirements.txt'
      - '.github/workflows/carbonio-cloud.yml'
  schedule:
    # Boletines diarios: tres intentos alrededor de la hora habitual de llegada.
    # Aunque haya reintentos, el recolector conserva un solo boletín más reciente por fuente y día.
    # Tabasco = UTC-6: 08:30, 10:15 y 10:45 hora local.
    - cron: '30 14 * * *'
    - cron: '15 16 * * *'
    - cron: '45 16 * * *'

permissions:
  contents: write

concurrency:
  group: carbonio-cloud
  cancel-in-progress: false

jobs:
  recolectar-carbonio:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar recolector Carbonio
        env:
          CARBONIO_BASE: https://correo.tabasco.gob.mx
          CARBONIO_USER: ${{ secrets.CARBONIO_USER }}
          CARBONIO_PASSWORD: ${{ secrets.CARBONIO_PASSWORD }}
          CARBONIO_USER_FUENTE1: ${{ secrets.CARBONIO_USER_FUENTE1 }}
          CARBONIO_PASSWORD_FUENTE1: ${{ secrets.CARBONIO_PASSWORD_FUENTE1 }}
          SOURCE1_REGEX: ${{ vars.SOURCE1_REGEX }}
          SOURCE2_REGEX: ${{ vars.SOURCE2_REGEX }}
          OUTPUT_DIR: out
        run: python src/carbonio_to_repo.py

      - name: Conservar PDF de la ejecución como respaldo temporal
        uses: actions/upload-artifact@v4
        with:
          name: carbonio-pdf-${{ github.run_id }}
          path: out/artifacts/*.pdf
          if-no-files-found: warn
          retention-days: 7

      - name: Publicar datos de lectura e histórico semanal de presas
        shell: bash
        run: |
          mkdir -p data
          cp -R out/data/. data/
          python src/presas_history.py
          git config user.name "Agente Hidrometeorologico Cloud"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Sin cambios de datos para publicar."
          else
            # No usar [skip ci]: el push de FUENTE1/FUENTE2 debe activar los workflows
            # que procesan esos datos, especialmente Niveles Hidrométricos Cloud.
            git commit -m "Actualiza boletines Carbonio cloud"
            git pull --rebase origin main
            git push origin main
          fi

# Cuenta secundaria dedicada a FUENTE1 habilitada por Secrets.
# La App no se modifica en este workflow; sólo se actualizan datos recolectados.
