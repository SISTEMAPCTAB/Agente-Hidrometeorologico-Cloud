name: Carbonio Cloud - boletines diarios

on:
  workflow_dispatch:
  schedule:
    # America/Mexico_City = UTC-6 durante 2026.
    # Tres intentos antes del análisis de las 11:00 h.
    - cron: '30 15 * * *'   # 09:30 h MX
    - cron: '15 16 * * *'   # 10:15 h MX
    - cron: '45 16 * * *'   # 10:45 h MX

permissions:
  contents: write

jobs:
  recolectar-carbonio:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: carbonio-cloud-daily
      cancel-in-progress: false

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar recolector Carbonio
        env:
          CARBONIO_BASE: https://correo.tabasco.gob.mx
          CARBONIO_USER: ${{ secrets.CARBONIO_USER }}
          CARBONIO_PASSWORD: ${{ secrets.CARBONIO_PASSWORD }}
          SOURCE1_REGEX: ${{ vars.SOURCE1_REGEX }}
          SOURCE2_REGEX: ${{ vars.SOURCE2_REGEX }}
          OUTPUT_DIR: out
        run: python src/carbonio_to_repo.py

      - name: Conservar PDF de la ejecución como respaldo temporal
        uses: actions/upload-artifact@v4
        with:
          name: carbonio-pdf-${{ github.run_id }}
          path: out/artifacts/*.pdf
          if-no-files-found: warn
          retention-days: 7

      - name: Publicar datos de lectura en el repositorio privado
        shell: bash
        run: |
          mkdir -p data
          cp -R out/data/. data/
          git config user.name "Agente Hidrometeorologico Cloud"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Sin cambios de datos para publicar."
          else
            git commit -m "Actualiza boletines Carbonio cloud [skip ci]"
            git push
          fi
