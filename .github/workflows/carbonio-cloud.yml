name: Carbonio Cloud - boletines diarios

on:
  # Programación: Cloudflare Worker despachador-hidro (cloudflare/despachador-hidro/worker.js, tabla JOBS).
  # Sin cron de GitHub: el cron de Actions retrasa o pierde corridas. Para cambiar el horario, editar JOBS.
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/carbonio_to_repo.py'
      - 'src/presas_history.py'
      - 'requirements.txt'
      - '.github/workflows/carbonio-cloud.yml'

permissions:
  contents: write

# Cola compartida: Carbonio, niveles y respaldos no publican datos simultáneamente.
concurrency:
  group: operacion-hidrometeorologica-writer
  cancel-in-progress: false

jobs:
  recolectar-carbonio:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar recolector Carbonio con reintentos
        env:
          CARBONIO_BASE: https://correo.tabasco.gob.mx
          CARBONIO_USER: ${{ secrets.CARBONIO_USER }}
          CARBONIO_PASSWORD: ${{ secrets.CARBONIO_PASSWORD }}
          CARBONIO_USER_FUENTE1: ${{ secrets.CARBONIO_USER_FUENTE1 }}
          CARBONIO_PASSWORD_FUENTE1: ${{ secrets.CARBONIO_PASSWORD_FUENTE1 }}
          SOURCE1_REGEX: ${{ vars.SOURCE1_REGEX }}
          SOURCE2_REGEX: ${{ vars.SOURCE2_REGEX }}
          OUTPUT_DIR: out
        shell: bash
        run: |
          set -e
          for intento in 1 2 3; do
            rm -rf out
            if python src/carbonio_to_repo.py; then exit 0; fi
            echo "Reintento Carbonio ${intento}/3"
            sleep $((intento * 15))
          done
          exit 1

      - name: Conservar PDF de la ejecución como respaldo temporal
        uses: actions/upload-artifact@v4
        with:
          name: carbonio-pdf-${{ github.run_id }}
          path: out/artifacts/*.pdf
          if-no-files-found: warn
          retention-days: 7

      - name: Publicar datos de lectura e histórico semanal de presas
        shell: bash
        run: |
          set -e
          mkdir -p data
          cp -R out/data/. data/
          python src/presas_history.py
          git config user.name "Agente Hidrometeorologico Cloud"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Sin cambios de datos para publicar."
            exit 0
          fi

          # No usar [skip ci]: FUENTE1/FUENTE2 deben activar procesamientos dependientes.
          git commit -m "Actualiza boletines Carbonio cloud"
          for intento in 1 2 3; do
            echo "Intento de publicación Carbonio ${intento}/3"
            if git pull --rebase origin main && git push origin main; then
              echo "Boletines Carbonio publicados."
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((intento * 10))
          done
          echo "No fue posible publicar Carbonio después de 3 intentos."
          exit 1

# Cuenta secundaria dedicada a FUENTE1 habilitada por Secrets.
# La App no se modifica en este workflow; sólo se actualizan datos recolectados.
