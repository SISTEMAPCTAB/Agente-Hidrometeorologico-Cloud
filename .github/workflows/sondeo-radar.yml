name: Sondeo radar Sabancuy (manual)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/sondeo_radar_sabancuy.py', '.github/workflows/sondeo-radar.yml']
permissions:
  contents: read
jobs:
  sondeo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python src/sondeo_radar_sabancuy.py
