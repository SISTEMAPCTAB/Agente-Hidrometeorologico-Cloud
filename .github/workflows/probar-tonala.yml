name: Probar informes Coatzacoalcos Tonala
on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - 'WeatherLink Cloud - 32 estaciones'
      - 'WeatherLink Cloud 30m - estable'
      - 'WeatherLink Rescue - independiente'
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'src/coatzacoalcos_tonala_probe.py'
      - '.github/workflows/probar-tonala.yml'
  schedule:
    # OCGC: sólo informe matutino vigente. Tres intentos absorben retrasos de publicación. Schedule reactivado 01-oct-2026.
    # 08:33, 10:03, 11:33 y respaldo vespertino 19:30 hora Tabasco.
    - cron: '33 14 * * 1-5'
    - cron: '3 16 * * 1-5'
    - cron: '33 17 * * 1-5'
    - cron: '30 1 * * 2-6'
permissions:
  contents: write
concurrency:
  group: tonala-pdf-probe
  cancel-in-progress: false
jobs:
  extract:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Decidir si Tonalá requiere recuperación
        id: gate
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo
          event=os.environ.get('GITHUB_EVENT_NAME','')
          run=True
          if event=='workflow_run':
              now=datetime.now(ZoneInfo('America/Mexico_City'))
              mins=now.hour*60+now.minute
              expected=None
              if 19*60+25 <= mins <= 23*60+59:
                  expected=now.date()
              elif 0 <= mins <= 2*60:
                  expected=(now-timedelta(days=1)).date()
              latest_date=None
              try:
                  p=json.loads(Path('data/coatzacoalcos_tonala/latest.json').read_text(encoding='utf-8'))
                  raw=((p.get('reports') or {}).get('matutino') or {}).get('date')
                  if raw: latest_date=datetime.fromisoformat(raw).date()
              except Exception:
                  pass
              run=bool(expected and (latest_date is None or latest_date < expected))
              print('Tonalá wake:', 'ahora=',now.isoformat(), 'esperado=',expected, 'vigente=',latest_date, 'ejecutar=',run)
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as out:
              out.write(f"run={'true' if run else 'false'}\n")
          PY
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: '3.11'
      - run: python -m pip install requests beautifulsoup4 pdfplumber playwright
        if: steps.gate.outputs.run == 'true'
      - run: python -m playwright install chromium
        if: steps.gate.outputs.run == 'true'
      - name: Descargar y examinar informes oficiales sin afectar otros datos
        if: steps.gate.outputs.run == 'true'
        run: python src/coatzacoalcos_tonala_probe.py
      - name: Guardar evidencia de la prueba
        if: ${{ always() && steps.gate.outputs.run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: prueba-tonala-pdf
          path: |
            data/coatzacoalcos_tonala/prueba_extraccion.json
            data/coatzacoalcos_tonala/latest.json
          if-no-files-found: warn
      - name: Publicar diagnóstico aislado
        if: ${{ success() && steps.gate.outputs.run == 'true' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp data/coatzacoalcos_tonala/prueba_extraccion.json /tmp/tonala-diagnostico.json
          cp data/coatzacoalcos_tonala/latest.json /tmp/tonala-latest.json
          for intento in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/tonala-diagnostico.json data/coatzacoalcos_tonala/prueba_extraccion.json
            if python - <<'PY'
          import json
          from pathlib import Path
          candidate=json.loads(Path('/tmp/tonala-latest.json').read_text())
          remote=json.loads(Path('data/coatzacoalcos_tonala/latest.json').read_text())
          a=candidate.get('reports',{}).get('matutino',{}).get('date','')
          b=remote.get('reports',{}).get('matutino',{}).get('date','')
          print('Corte candidato/remoto:',a,b)
          raise SystemExit(0 if a>b else 1)
          PY
            then
              cp /tmp/tonala-latest.json data/coatzacoalcos_tonala/latest.json
            else
              echo "Sin informe validado posterior; se conserva el último corte."
            fi
            git add data/coatzacoalcos_tonala/prueba_extraccion.json data/coatzacoalcos_tonala/latest.json
            if git diff --cached --quiet; then
              echo "Sin cambios que publicar."
              exit 0
            fi
            git commit -m 'Actualiza diagnóstico Tonala y conserva último corte validado [skip ci]'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((intento * 5))
          done
          exit 1
