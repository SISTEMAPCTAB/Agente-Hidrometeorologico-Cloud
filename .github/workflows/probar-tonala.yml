name: Probar informes Coatzacoalcos Tonala
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/coatzacoalcos_tonala_probe.py'
      - '.github/workflows/probar-tonala.yml'
  schedule:
    - cron: '30 15,22 * * *'
permissions:
  contents: write
concurrency:
  group: tonala-pdf-probe
  cancel-in-progress: false
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests beautifulsoup4 pdfplumber
      - name: Descargar y examinar informes oficiales sin afectar otros datos
        run: python src/coatzacoalcos_tonala_probe.py
      - name: Guardar evidencia de la prueba
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prueba-tonala-pdf
          path: data/coatzacoalcos_tonala/prueba_extraccion.json
          if-no-files-found: warn
      - name: Publicar diagnóstico aislado
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/coatzacoalcos_tonala/prueba_extraccion.json
          if ! git diff --cached --quiet; then
            git commit -m 'Diagnostico de acceso a informes Tonala [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
