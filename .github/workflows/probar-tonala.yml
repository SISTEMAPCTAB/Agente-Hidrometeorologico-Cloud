name: Probar informes Coatzacoalcos Tonala
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/coatzacoalcos_tonala_probe.py'
      - '.github/workflows/probar-tonala.yml'
  schedule:
    # OCGC: sólo informe matutino vigente. Tres intentos absorben retrasos de publicación. Schedule reactivado 01-oct-2026.
    # 08:33, 10:03 y 11:33 hora Tabasco.
    - cron: '33 14 * * *'
    - cron: '3 16 * * *'
    - cron: '33 17 * * *'
permissions:
  contents: write
concurrency:
  group: tonala-pdf-probe
  cancel-in-progress: false
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests beautifulsoup4 pdfplumber
      - name: Descargar y examinar informes oficiales sin afectar otros datos
        run: python src/coatzacoalcos_tonala_probe.py
      - name: Guardar evidencia de la prueba
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prueba-tonala-pdf
          path: |
            data/coatzacoalcos_tonala/prueba_extraccion.json
            data/coatzacoalcos_tonala/latest.json
          if-no-files-found: warn
      - name: Publicar diagnóstico aislado
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp data/coatzacoalcos_tonala/prueba_extraccion.json /tmp/tonala-diagnostico.json
          cp data/coatzacoalcos_tonala/latest.json /tmp/tonala-latest.json
          for intento in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            if python - <<'PY'
          import json
          from pathlib import Path
          candidate=json.loads(Path('/tmp/tonala-latest.json').read_text())
          remote=json.loads(Path('data/coatzacoalcos_tonala/latest.json').read_text())
          a=candidate.get('reports',{}).get('matutino',{}).get('date','')
          b=remote.get('reports',{}).get('matutino',{}).get('date','')
          print('Corte candidato/remoto:',a,b)
          raise SystemExit(0 if b>=a else 1)
          PY
            then
              echo "El remoto ya contiene un corte igual o posterior."
              exit 0
            fi
            cp /tmp/tonala-diagnostico.json data/coatzacoalcos_tonala/prueba_extraccion.json
            cp /tmp/tonala-latest.json data/coatzacoalcos_tonala/latest.json
            git add data/coatzacoalcos_tonala/prueba_extraccion.json data/coatzacoalcos_tonala/latest.json
            git commit -m 'Actualiza informe validado Tonala [skip ci]'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((intento * 5))
          done
          exit 1
