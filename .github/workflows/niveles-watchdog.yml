name: Watchdog Niveles Hidrométricos Cloud

on:
  workflow_dispatch:
  schedule:
    # Respaldo aislado 30 min después de cada ventana principal de 2 h.
    # Tabasco: 07:20, 09:20, 11:20, 13:20, 15:20, 17:20, 19:20, 21:20, 23:20 y 01:20.
    - cron: '20 1,3,5,7,13,15,17,19,21,23 * * *'

permissions:
  contents: write

concurrency:
  group: niveles-hidrometricos-cloud
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determinar si el agente principal está atrasado
        id: stale
        shell: bash
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          p=Path('data/niveles/Estado_Niveles_Cloud.json')
          stale=True
          age_min=None
          if p.exists():
              try:
                  d=json.loads(p.read_text(encoding='utf-8'))
                  s=d.get('run_utc')
                  if s:
                      dt=datetime.fromisoformat(s.replace('Z','+00:00'))
                      age_min=(datetime.now(timezone.utc)-dt.astimezone(timezone.utc)).total_seconds()/60
                      stale=age_min>70
              except Exception as e:
                  print('Estado no legible:',e)
          print('Edad del último estado (min):', age_min)
          print('STALE=',stale)
          with open(__import__('os').environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              f.write(f"stale={'true' if stale else 'false'}\n")
          PY

      - name: Estado reciente; no intervenir
        if: steps.stale.outputs.stale != 'true'
        run: echo "El agente principal está reciente. Watchdog sin intervención."

      - name: Configurar Python
        if: steps.stale.outputs.stale == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Configurar Node
        if: steps.stale.outputs.stale == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias
        if: steps.stale.outputs.stale == 'true'
        run: |
          pip install -r requirements.txt
          npm install --no-audit --no-fund

      - name: Recuperar niveles desde Carbonio
        if: steps.stale.outputs.stale == 'true'
        env:
          CARBONIO_BASE: https://correo.tabasco.gob.mx
          CARBONIO_USER: ${{ secrets.CARBONIO_USER }}
          CARBONIO_PASSWORD: ${{ secrets.CARBONIO_PASSWORD }}
          CARBONIO_USER_FUENTE1: ${{ secrets.CARBONIO_USER_FUENTE1 }}
          CARBONIO_PASSWORD_FUENTE1: ${{ secrets.CARBONIO_PASSWORD_FUENTE1 }}
          NIVELES_BASE: data/niveles
        run: |
          python src/niveles_cloud_robusto.py
          python src/niveles_horas_cloud.py

      - name: Completar productos derivados
        if: steps.stale.outputs.stale == 'true'
        env:
          CARBONIO_BASE: https://correo.tabasco.gob.mx
          CARBONIO_USER: ${{ secrets.CARBONIO_USER }}
          CARBONIO_PASSWORD: ${{ secrets.CARBONIO_PASSWORD }}
          CARBONIO_USER_FUENTE1: ${{ secrets.CARBONIO_USER_FUENTE1 }}
          CARBONIO_PASSWORD_FUENTE1: ${{ secrets.CARBONIO_PASSWORD_FUENTE1 }}
          NIVELES_BASE: data/niveles
        run: |
          python src/fuente2_niveles.py
          python src/extraer_clima_boletines.py
          python src/lluvia_conagua_cloud.py
          python src/niveles_postprocess.py
          python src/resumen_12h_niveles.py
          python src/generar_word_niveles.py

      - name: Auditar valores recuperados
        if: steps.stale.outputs.stale == 'true'
        run: python src/auditar_productos_operativos.py

      - name: Verificar productos críticos
        if: steps.stale.outputs.stale == 'true'
        shell: bash
        run: |
          test -s data/niveles/Ultimo_Corte/ultimo_resumen.json
          test -s data/niveles/Historico/niveles_historicos.json
          test -s data/niveles/Estado_Niveles_Cloud.json
          test -s data/niveles/Auditoria/ultimo_resultado.json
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('data/niveles/Estado_Niveles_Cloud.json').read_text(encoding='utf-8'))
          a=json.loads(Path('data/niveles/Auditoria/ultimo_resultado.json').read_text(encoding='utf-8'))
          assert s.get('stations_in_latest_summary',0) > 0, 'Resumen de niveles vacío'
          assert isinstance(s.get('errors',[]), list), 'Estado de errores inválido'
          assert not s.get('errors'), f"Errores del agente: {s.get('errors')}"
          assert a.get('ok') is True, f"Auditoría bloqueó recuperación: {a.get('errores')}"
          print('Watchdog validó:',s.get('stations_in_latest_summary'),'estaciones; corte:',s.get('latest_subject'))
          PY

      - name: Publicar recuperación sin rebase de históricos
        if: steps.stale.outputs.stale == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Agente Hidrometeorologico Watchdog"
          git config user.email "actions@users.noreply.github.com"
          tar -cf /tmp/watchdog-niveles.tar data/niveles
          cp data/niveles/Estado_Niveles_Cloud.json /tmp/watchdog-estado.json
          for intento in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            if python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime,timezone
          def stamp(p):
              try:
                  s=json.loads(Path(p).read_text(encoding='utf-8'))['run_utc']
                  return datetime.fromisoformat(s.replace('Z','+00:00')).astimezone(timezone.utc)
              except (OSError,ValueError,KeyError,TypeError):return None
          candidate=stamp('/tmp/watchdog-estado.json')
          remote=stamp('data/niveles/Estado_Niveles_Cloud.json')
          print('Watchdog candidato/remoto:',candidate,remote)
          raise SystemExit(0 if candidate is None or (remote and remote>=candidate) else 1)
          PY
            then
              echo "El remoto ya tiene revisión igual o posterior."
              exit 0
            fi
            tar -xf /tmp/watchdog-niveles.tar
            git add data/niveles
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Watchdog recupera niveles hidrométricos [skip ci]"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((intento * 8))
          done
          echo "No se publicó la recuperación tras cuatro intentos."
          exit 1
