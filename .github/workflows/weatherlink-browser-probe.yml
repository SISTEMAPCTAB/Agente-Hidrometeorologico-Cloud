name: WeatherLink Cloud - prueba navegador

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/weatherlink_browser_probe.py'
      - '.github/workflows/weatherlink-browser-probe.yml'

permissions:
  contents: write

jobs:
  probar-weatherlink-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Probar WeatherLink con navegador headless
        run: python src/weatherlink_browser_probe.py

      - name: Guardar diagnóstico
        shell: bash
        run: |
          cp out/weatherlink_browser_probe.json data/weatherlink_browser_probe.json
          git config user.name "Agente Hidrometeorologico Cloud"
          git config user.email "actions@users.noreply.github.com"
          git add data/weatherlink_browser_probe.json
          if git diff --cached --quiet; then
            echo "Sin cambios en diagnóstico."
          else
            git commit -m "Actualiza diagnóstico WeatherLink navegador [skip ci]"
            git push
          fi
