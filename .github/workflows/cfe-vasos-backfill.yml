name: CFE vasos · recuperar histórico horario (manual)
on:
  workflow_dispatch:
    inputs:
      dias:
        description: 'Días hacia atrás'
        default: '45'
permissions:
  contents: write
concurrency:
  group: cfe-vasos-backfill
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Recuperar reportes CFE (sólo data/cfe_vasos/historico)
        env:
          GMAIL_BACKUP_USER: ${{ secrets.CFE_GMAIL_USER || secrets.GMAIL_USER }}
          GMAIL_BACKUP_APP_PASSWORD: ${{ secrets.CFE_GMAIL_APP_PASSWORD || secrets.GMAIL_APP_PASSWORD }}
        run: |
          pip install -q openpyxl==3.1.5
          python src/cfe_vasos_backfill.py "${{ github.event.inputs.dias }}"
          git config user.name "Agente Hidrometeorologico Gmail Backup"
          git config user.email "actions@users.noreply.github.com"
          tar -cf /tmp/h.tar data/cfe_vasos/historico
          for i in 1 2 3 4; do
            git fetch -q origin main && git reset -q --hard origin/main && tar -xf /tmp/h.tar
            git add data/cfe_vasos/historico
            if git diff --cached --quiet; then echo sin cambios; exit 0; fi
            git commit -q -m "CFE vasos: histórico horario recuperado [skip ci]"
            git push -q origin HEAD:main && exit 0; sleep 5
          done
