name: Análisis Hidrometeorológico - Word persistente

on:
  # Programación: Cloudflare Worker despachador-hidro (cloudflare/despachador-hidro/worker.js, tabla JOBS).
  # Sin cron de GitHub: el cron de Actions retrasa o pierde corridas. Para cambiar el horario, editar JOBS.
  # Disparo automático restaurado (era el bloque vigente antes del commit que
  # lo desactivó): corre al cambiar los datos que alimentan el análisis y,
  # además, el Worker lo lanza a las 11:05 hora de Tabasco (17:05 UTC;
  # México ya no usa horario de verano). Si un corte llega tarde, el
  # siguiente push de datos vuelve a generar el análisis.
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'data/analysis/latest.md'
      - 'data/analysis/chat/latest.md'
      - 'data/niveles/Ultimo_Corte/ultimo_resumen.json'
      - 'data/niveles/Resumen_12h/resumen_12h.json'
      - 'data/niveles/Lluvia_CONAGUA/**'
      - 'data/latest/FUENTE1.txt'
      - 'data/latest/FUENTE2.txt'
      - 'data/fuentes_publicas/latest.json'
      - 'data/fuentes_publicas/insivumeh_historico.json'
      - 'data/fuentes_publicas/insivumeh_automaticas.json'
      - 'data/weatherlink/latest.json'
      - 'data/weatherlink/extra_latest.json'
      - 'data/weatherlink/Estado_WeatherLink_Cloud.json'
      - 'data/presas/historico_mensual.json'

permissions:
  contents: write

concurrency:
  group: analisis-hidrometeorologico-11h
  cancel-in-progress: false

jobs:
  generar-word-analisis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Detectar informe íntegro del chat
        id: chat
        shell: bash
        run: |
          python - <<'PY'
          import re, os
          from pathlib import Path
          from datetime import datetime
          a=Path('data/analysis/latest.md'); c=Path('data/analysis/chat/latest.md')
          def cut(p):
              if not p.exists(): return None
              m=re.search(r'^CORTE: (\d{4}-\d{2}-\d{2} \d{2}:\d{2})',p.read_text(encoding='utf-8-sig'),re.M)
              return datetime.strptime(m.group(1),'%Y-%m-%d %H:%M') if m else None
          cc=cut(c); ac=cut(a)
          selected=bool(cc and c.stat().st_size>1000 and (not ac or cc>=ac))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write(f'selected={str(selected).lower()}\n')
          print('Informe del chat seleccionado:',selected)
          PY

      - name: Generar análisis diario 11 h desde datos cloud
        if: steps.chat.outputs.selected != 'true'
        shell: bash
        run: |
          set -e
          for intento in 1 2 3; do
            if python src/generar_analisis_diario.py; then exit 0; fi
            echo "Reintento generar análisis ${intento}/3"
            sleep $((intento * 10))
          done
          exit 1

      - name: Integrar Frontera Sur y control de fuentes
        if: steps.chat.outputs.selected != 'true'
        shell: bash
        run: |
          set -e
          for intento in 1 2 3; do
            if python src/complementar_analisis_fuente1.py; then exit 0; fi
            echo "Reintento complementar análisis ${intento}/3"
            sleep $((intento * 10))
          done
          exit 1

      - name: Verificar latest.md
        if: steps.chat.outputs.selected != 'true'
        shell: bash
        run: |
          test -s data/analysis/latest.md
          head -n 1 data/analysis/latest.md | grep -Eq '^CORTE: [0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}$'
          test $(wc -c < data/analysis/latest.md) -gt 1000
          grep -q '## 2. Cuenca del Usumacinta' data/analysis/latest.md
          # Lacantún puede no tener lectura verificable en el corte; su ausencia
          # no debe impedir publicar el análisis de las demás estaciones.
          if ! grep -Fq '| Lacantún (BHG21, Ocosingo) |' data/analysis/latest.md; then
            echo 'AVISO: Lacantún no figura en el corte; verificar control de fuentes.'
          fi
          grep -q '## 3. Ríos Serranos y Bajo Grijalva' data/analysis/latest.md
          grep -q '## 4. Sistema de presas del Grijalva y corrientes asociadas' data/analysis/latest.md
          grep -q '## 5. Samaria, Carrizal y Mezcalapa' data/analysis/latest.md
          grep -q '## 7. Escenario por horizonte' data/analysis/latest.md
          grep -q '## Control de fuentes y hora real de actualización' data/analysis/latest.md

      - name: Generar y verificar Word del análisis
        env:
          ANALYSIS_SOURCE: ${{ steps.chat.outputs.selected == 'true' && 'data/analysis/chat/latest.md' || 'data/analysis/latest.md' }}
        shell: bash
        run: |
          set -e
          for intento in 1 2 3; do
            if python src/generar_word_analisis.py; then exit 0; fi
            echo "Reintento generar Word ${intento}/3"
            sleep $((intento * 10))
          done
          exit 1

      - name: Publicar análisis y Word persistente
        shell: bash
        run: |
          set -e
          git config user.name "Agente Hidrometeorologico Cloud"
          git config user.email "actions@users.noreply.github.com"
          git add data/analysis/latest.md data/analysis/Reportes
          if git diff --cached --quiet; then
            echo "Sin cambios del análisis/Word."
            exit 0
          fi

          git commit -m "Actualiza análisis 11 h y Word persistente [skip ci]"
          for intento in 1 2 3; do
            echo "Intento de publicación ${intento}/3"
            if git pull --rebase origin main && git push origin main; then
              echo "Análisis y Word publicados."
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((intento * 10))
          done
          echo "No fue posible publicar el análisis después de 3 intentos."
          exit 1
