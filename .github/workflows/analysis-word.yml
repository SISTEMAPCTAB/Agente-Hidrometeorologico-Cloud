name: Análisis Hidrometeorológico - Word persistente

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'data/analysis/latest.md'
      - 'src/generar_word_analisis.py'
      - 'requirements.txt'
      - '.github/workflows/analysis-word.yml'
  schedule:
    # Respaldo: vuelve a intentar pocos minutos después del análisis de las 11:00 h.
    - cron: '8 17 * * *'   # 11:08 h America/Mexico_City (UTC-6)

permissions:
  contents: write

jobs:
  generar-word-analisis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: analysis-word-cloud
      cancel-in-progress: true

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Generar y verificar Word del análisis
        run: python src/generar_word_analisis.py

      - name: Publicar Word persistente
        shell: bash
        run: |
          git config user.name "Agente Hidrometeorologico Cloud"
          git config user.email "actions@users.noreply.github.com"
          git add data/analysis/Reportes
          if git diff --cached --quiet; then
            echo "Sin cambios del Word del análisis."
          else
            git commit -m "Actualiza Word persistente del análisis [skip ci]"
            git push
          fi
