name: Análisis Hidrometeorológico - Word persistente

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'data/analysis/latest.md'
      - 'src/generar_word_analisis.py'
      - 'requirements.txt'
      - '.github/workflows/analysis-word.yml'
  schedule:
    - cron: '8 17 * * *'

permissions:
  contents: write

concurrency:
  group: agente-hidrometeorologico-repo-writer
  cancel-in-progress: false

jobs:
  generar-word-analisis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Generar y verificar Word del análisis
        run: python src/generar_word_analisis.py

      - name: Publicar Word persistente
        shell: bash
        run: |
          git config user.name "Agente Hidrometeorologico Cloud"
          git config user.email "actions@users.noreply.github.com"
          git add data/analysis/Reportes
          if git diff --cached --quiet; then
            echo "Sin cambios del Word del análisis."
          else
            git commit -m "Actualiza Word persistente del análisis [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
