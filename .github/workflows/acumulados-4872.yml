name: Acumulados observados 48 y 72 h

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/acumulados_4872.py'
      - '.github/workflows/acumulados-4872.yml'
  schedule:
    # Producto derivado: recalcular sólo tras ventanas en que cambian sus fuentes.
    # 08:45, 14:45 y 20:45 hora Tabasco.
    - cron: '45 14,20,2 * * *'

permissions:
  contents: write

concurrency:
  group: acumulados-4872
  cancel-in-progress: false

jobs:
  calcular:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar repositorio con historial completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Calcular acumulados sólo con observaciones reales
        run: python src/acumulados_4872.py

      - name: Verificar producto
        shell: bash
        run: |
          set -e
          test -s data/fuentes_publicas/acumulados_4872.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/fuentes_publicas/acumulados_4872.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert isinstance(d.get('insivumeh'), list), 'Falta arreglo INSIVUMEH'
          assert isinstance(d.get('lacantun'), dict), 'Falta Lacantún'
          print('Producto 48/72 verificado:', len(d.get('insivumeh', [])), 'estaciones')
          PY

      - name: Publicar sólo el producto derivado
        shell: bash
        run: |
          set -e
          git config user.name "Agente Hidrometeorologico Acumulados"
          git config user.email "actions@users.noreply.github.com"
          git add data/fuentes_publicas/acumulados_4872.json
          if git diff --cached --quiet; then
            echo "Sin cambios en acumulados 48/72."
            exit 0
          fi
          git commit -m "Actualiza acumulados observados 48 y 72 h [skip ci]"
          for intento in 1 2 3; do
            if git pull --rebase origin main && git push origin main; then
              echo "Acumulados 48/72 publicados."
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((intento * 8))
          done
          exit 1
