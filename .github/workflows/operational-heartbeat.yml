name: Operational Heartbeat - WeatherLink

on:
  workflow_dispatch:
  schedule:
    - cron: '3,18,33,48 * * * *'

permissions:
  contents: write

concurrency:
  group: operational-heartbeat
  cancel-in-progress: true

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: WeatherLink
        run: |
          python src/weatherlink_resolve_shared.py
          python src/weatherlink_cloud.py
          python src/weatherlink_extra_cloud.py
      - name: Validar frescura
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          w=json.loads(Path('data/weatherlink/Estado_WeatherLink_Cloud.json').read_text())
          assert w.get('complete') is True and w.get('stations_ok')==w.get('stations_expected')
          print('WeatherLink',w.get('run_local'))
          PY
      - name: Publicar sin retroceder
        run: |
          set -e
          git config user.name "Agente Hidrometeorologico Cloud"
          git config user.email "actions@users.noreply.github.com"
          tar -cf /tmp/heartbeat.tar data/weatherlink/state.json data/weatherlink/latest.json data/weatherlink/extra_state.json data/weatherlink/extra_latest.json data/weatherlink/shared_resolved.json data/weatherlink/Tabla_WeatherLink_Cloud.csv data/weatherlink/Estado_WeatherLink_Cloud.json
          git fetch origin main
          git reset --hard origin/main
          tar -xf /tmp/heartbeat.tar
          git add data/weatherlink
          git diff --cached --quiet && exit 0
          git commit -m "Heartbeat WeatherLink [skip ci]"
          git pull --rebase origin main
          git push origin main
