name: WeatherLink autónomo estable - cada 30 minutos

on:
  # Programación: Cloudflare Worker despachador-hidro (cloudflare/despachador-hidro/worker.js, tabla JOBS).
  # Sin cron de GitHub: el cron de Actions retrasa o pierde corridas. Para cambiar el horario, editar JOBS.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weatherlink-periodico
  cancel-in-progress: false

jobs:
  weatherlink:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar estado vigente
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Decidir si corresponde una nueva recolección
        id: freshness
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          def age(path):
              try:
                  d=json.loads(Path(path).read_text(encoding='utf-8'))
                  s=d.get('run_utc')
                  if not s:
                      return 9999.0
                  t=datetime.fromisoformat(str(s).replace('Z','+00:00'))
                  if t.tzinfo is None:
                      t=t.replace(tzinfo=timezone.utc)
                  return (datetime.now(timezone.utc)-t.astimezone(timezone.utc)).total_seconds()/60.0
              except Exception:
                  return 9999.0

          principal=age('data/weatherlink/Estado_WeatherLink_Cloud.json')
          adicional=age('data/weatherlink/extra_latest.json')
          stale=max(principal, adicional) > 20.0
          print(f'principal={principal:.1f} min; adicional={adicional:.1f} min; recolectar={stale}')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              f.write(f"stale={'true' if stale else 'false'}\n")
          PY

      - name: Corte vigente; terminar sin reproceso
        if: steps.freshness.outputs.stale != 'true'
        run: echo "WeatherLink vigente. No se recolecta ni se publica nada."

      - name: Configurar Python
        if: steps.freshness.outputs.stale == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar sólo dependencia necesaria
        if: steps.freshness.outputs.stale == 'true'
        run: pip install --disable-pip-version-check --no-cache-dir requests

      - name: Recolectar WeatherLink de forma independiente
        id: collect
        if: steps.freshness.outputs.stale == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python src/weatherlink_cloud.py
          if python src/weatherlink_extra_cloud.py; then
            echo "extra_ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "Aviso: falló el recolector adicional; se publica el principal sin alterar los datos adicionales."
            echo "extra_ok=false" >> "$GITHUB_OUTPUT"
            git checkout -- data/weatherlink/extra_state.json data/weatherlink/extra_latest.json
          fi

      - name: Validar corte antes de publicar
        if: steps.freshness.outputs.stale == 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          s=json.loads(Path('data/weatherlink/Estado_WeatherLink_Cloud.json').read_text(encoding='utf-8'))
          e=json.loads(Path('data/weatherlink/extra_latest.json').read_text(encoding='utf-8')) if '${{ steps.collect.outputs.extra_ok }}' == 'true' else None
          assert s.get('stations_expected') == 32, 'Configuración principal inesperada'
          assert 0 < s.get('stations_ok', 0) <= 32, 'Ninguna estación principal recuperada'
          assert s.get('stations_error') == len(s.get('errors') or []), 'Conteo de errores inconsistente'
          assert s['stations_ok'] + s['stations_error'] == 32, 'Conteo total de estaciones inconsistente'
          principal=json.loads(Path('data/weatherlink/latest.json').read_text(encoding='utf-8'))
          expected_extra=json.loads(Path('config/weatherlink_stations_extra.json').read_text(encoding='utf-8'))
          expected_main=json.loads(Path('config/weatherlink_stations.json').read_text(encoding='utf-8'))
          groups=[('principal',principal['stations'],expected_main)]
          if e is not None:
              groups.append(('adicional',e['stations'],expected_extra))
          for label,observed,configured in groups:
              uuids=[row.get('uuid') for row in observed]
              expected={row['uuid'] for row in configured}
              assert len(uuids)==len(expected) and set(uuids)==expected, f'{label}: estaciones ausentes, ajenas o duplicadas'
          assert sum(not row.get('error') for row in principal['stations']) == s['stations_ok'], 'Estaciones correctas inconsistentes'
          assert sum(bool(row.get('error')) for row in principal['stations']) == s['stations_error'], 'Estaciones fallidas inconsistentes'
          assert principal.get('run_utc')==s.get('run_utc'), 'Estado principal y datos no corresponden al mismo corte'

          for label,obj in [('principal',s)] + ([('adicional',e)] if e is not None else []):
              t=datetime.fromisoformat(str(obj['run_utc']).replace('Z','+00:00'))
              if t.tzinfo is None:
                  t=t.replace(tzinfo=timezone.utc)
              # La duración de consultas no invalida un corte recién generado.
              # Sólo rechazar fechas futuras incoherentes.
              skew=(t.astimezone(timezone.utc)-datetime.now(timezone.utc)).total_seconds()
              assert skew <= 120, f'{label} tiene fecha futura incoherente: {skew:.0f} s'
          print(f"WeatherLink validado: {s['stations_ok']}/32; fallas aisladas: {s['stations_error']}; corte reciente.")
          PY

      - name: Publicar sólo productos WeatherLink vigentes
        if: steps.freshness.outputs.stale == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "WeatherLink Autónomo"
          git config user.email "actions@users.noreply.github.com"

          PRODUCTOS=(
            data/weatherlink/state.json
            data/weatherlink/latest.json
            data/weatherlink/extra_state.json
            data/weatherlink/extra_latest.json
            data/weatherlink/Tabla_WeatherLink_Cloud.csv
            data/weatherlink/Estado_WeatherLink_Cloud.json
          )

          if [ "${{ steps.collect.outputs.extra_ok }}" != "true" ]; then
            PRODUCTOS_FILTRADOS=()
            for producto in "${PRODUCTOS[@]}"; do
              case "$producto" in
                data/weatherlink/extra_state.json|data/weatherlink/extra_latest.json) ;;
                *) PRODUCTOS_FILTRADOS+=("$producto") ;;
              esac
            done
            PRODUCTOS=("${PRODUCTOS_FILTRADOS[@]}")
          fi
          tar -cf /tmp/weatherlink-autonomo.tar "${PRODUCTOS[@]}"
          cp data/weatherlink/Estado_WeatherLink_Cloud.json /tmp/weatherlink-candidato.json

          for ciclo in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            if python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          def stamp(path):
              try:
                  s=json.loads(Path(path).read_text(encoding='utf-8'))['run_utc']
                  d=datetime.fromisoformat(str(s).replace('Z','+00:00'))
                  return d if d.tzinfo else d.replace(tzinfo=timezone.utc)
              except Exception:
                  return None
          proposed=stamp('/tmp/weatherlink-candidato.json')
          current=stamp('data/weatherlink/Estado_WeatherLink_Cloud.json')
          raise SystemExit(0 if proposed and current and current>=proposed else 1)
          PY
            then
              echo "El remoto ya contiene este corte o uno posterior."
              exit 0
            fi

            tar -xf /tmp/weatherlink-autonomo.tar
            git add "${PRODUCTOS[@]}"
            git diff --cached --quiet && exit 0
            git commit -m "Actualiza WeatherLink autónomo [skip ci]"

            for intento in 1 2 3; do
              if git push origin HEAD:main; then
                echo "WeatherLink autónomo publicado."
                exit 0
              fi
              sleep $((intento * 8))
            done
            sleep $((ciclo * 8))
          done

          echo "No fue posible publicar WeatherLink autónomo."
          exit 1
