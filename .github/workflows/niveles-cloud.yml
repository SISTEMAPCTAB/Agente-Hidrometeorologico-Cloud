name: Niveles Hidrométricos Cloud

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/niveles_cloud.py'
      - 'src/niveles_cloud_robusto.py'
      - 'src/niveles_horas_cloud.py'
      - 'src/fuente2_niveles.py'
      - 'src/lluvia_conagua_cloud.py'
      - 'src/extraer_clima_boletines.py'
      - 'src/auditar_productos_operativos.py'
      - 'src/procesar_niveles.js'
      - 'src/procesar_niveles_horas.js'
      - 'src/extraer_lluvia_conagua.js'
      - 'src/niveles_postprocess.py'
      - 'src/resumen_12h_niveles.py'
      - 'src/generar_word_niveles.py'
      - 'data/latest/FUENTE1.txt'
      - 'data/latest/FUENTE2.txt'
      - 'requirements.txt'
      - 'package.json'
      - '.github/workflows/niveles-cloud.yml'
  schedule:
    # Tabasco UTC-6: cada hora de 06:50 a 18:50; pausa nocturna.
    # Este es el recolector primario. Los respaldos se ejecutan después,
    # escalonados, para no bloquear su turno de :50 en la cola de escritura.
    # Los boletines nuevos en data/latest/FUENTE1.txt o FUENTE2.txt
    # también disparan este flujo por push, sin esperar al siguiente turno.
    - cron: '50 12-23,0 * * *'

permissions:
  contents: write

concurrency:
  group: datos-hidrometeorologicos-writer
  cancel-in-progress: false

jobs:
  recolectar-niveles:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias Python
        run: pip install -r requirements.txt

      - name: Instalar dependencias Node
        run: npm install --no-audit --no-fund

      - name: Ejecutar niveles hidrométricos cloud
        env:
          CARBONIO_BASE: https://correo.tabasco.gob.mx
          CARBONIO_USER: ${{ secrets.CARBONIO_USER }}
          CARBONIO_PASSWORD: ${{ secrets.CARBONIO_PASSWORD }}
          CARBONIO_USER_FUENTE1: ${{ secrets.CARBONIO_USER_FUENTE1 }}
          CARBONIO_PASSWORD_FUENTE1: ${{ secrets.CARBONIO_PASSWORD_FUENTE1 }}
          NIVELES_BASE: data/niveles
        run: python src/niveles_cloud_robusto.py

      - name: Completar todas las horas publicadas del boletín hidrométrico
        env:
          CARBONIO_BASE: https://correo.tabasco.gob.mx
          CARBONIO_USER: ${{ secrets.CARBONIO_USER }}
          CARBONIO_PASSWORD: ${{ secrets.CARBONIO_PASSWORD }}
          CARBONIO_USER_FUENTE1: ${{ secrets.CARBONIO_USER_FUENTE1 }}
          CARBONIO_PASSWORD_FUENTE1: ${{ secrets.CARBONIO_PASSWORD_FUENTE1 }}
          NIVELES_BASE: data/niveles
        run: python src/niveles_horas_cloud.py

      - name: Incorporar corte FUENTE2 de las 08:00 a niveles vigentes
        run: python src/fuente2_niveles.py

      - name: Extraer lluvia y temperatura de boletines CONAGUA Tabasco y Frontera Sur
        run: python src/extraer_clima_boletines.py

      - name: Extraer lluvia horaria CONAGUA del reporte más reciente
        env:
          CARBONIO_BASE: https://correo.tabasco.gob.mx
          CARBONIO_USER: ${{ secrets.CARBONIO_USER }}
          CARBONIO_PASSWORD: ${{ secrets.CARBONIO_PASSWORD }}
          CARBONIO_USER_FUENTE1: ${{ secrets.CARBONIO_USER_FUENTE1 }}
          CARBONIO_PASSWORD_FUENTE1: ${{ secrets.CARBONIO_PASSWORD_FUENTE1 }}
          NIVELES_BASE: data/niveles
        run: python src/lluvia_conagua_cloud.py

      - name: Calcular ciclo 06:00 y generar gráficas PNG
        run: python src/niveles_postprocess.py

      - name: Generar resumen compacto últimas 12 h
        run: python src/resumen_12h_niveles.py

      - name: Generar y verificar Word de niveles
        run: python src/generar_word_niveles.py

      - name: Auditar valores antes de publicar
        run: python src/auditar_productos_operativos.py

      - name: Verificar productos críticos antes de publicar
        shell: bash
        run: |
          test -s data/niveles/Ultimo_Corte/ultimo_resumen.json
          test -s data/niveles/Historico/niveles_historicos.json
          test -s data/niveles/Estado_Niveles_Cloud.json
          test -s data/niveles/Auditoria/ultimo_resultado.json
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('data/niveles/Estado_Niveles_Cloud.json').read_text(encoding='utf-8'))
          a=json.loads(Path('data/niveles/Auditoria/ultimo_resultado.json').read_text(encoding='utf-8'))
          assert s.get('stations_in_latest_summary',0) > 0, 'Resumen de niveles vacío'
          assert isinstance(s.get('errors',[]), list), 'Estado de errores inválido'
          assert s.get('complete') is True, 'Extracción principal incompleta'
          assert not s.get('errors'), f"Errores de extracción: {s.get('errors')}"
          assert a.get('ok') is True, f"Auditoría bloqueó publicación: {a.get('errores')}"
          print('Niveles verificados:', s.get('stations_in_latest_summary'), 'estaciones; corte:', s.get('latest_subject'))
          print('Auditoría automática: OK')
          PY

      - name: Publicar niveles, lluvia, clima CONAGUA, gráficas y Word
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Agente Hidrometeorologico Cloud"
          git config user.email "actions@users.noreply.github.com"

          PRODUCTOS=(
            data/niveles/Historico
            data/niveles/Resumen_12h
            data/niveles/Ultimo_Corte
            data/niveles/Estado
            data/niveles/Estado_Niveles_Cloud.json
            data/niveles/Lluvia_CONAGUA
            data/niveles/Clima_CONAGUA
            data/niveles/Auditoria
            data/niveles/Graficas
            data/niveles/Reportes
            data/niveles/Evidencia_Texto
          )

          tar -cf /tmp/productos-niveles.tar "${PRODUCTOS[@]}"

          for intento in 1 2 3; do
            echo "Intento de publicación niveles ${intento}/3"
            git fetch origin main
            git reset --hard origin/main
            tar -xf /tmp/productos-niveles.tar
            git add "${PRODUCTOS[@]}"

            if git diff --cached --quiet; then
              echo "Sin cambios de niveles/lluvia/clima para publicar."
              exit 0
            fi

            git commit -m "Actualiza niveles lluvia clima CONAGUA y graficas [skip ci]"
            if git push origin HEAD:main; then
              echo "Niveles publicados sin conflictos."
              exit 0
            fi

            echo "El remoto cambió durante la publicación; se reconstruirá el commit sobre el HEAD vigente."
            sleep $((intento * 8))
          done

          echo "No fue posible publicar niveles después de 3 intentos."
          exit 1
