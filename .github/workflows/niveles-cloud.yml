name: Niveles Hidrométricos Cloud

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/niveles_cloud.py'
      - 'src/niveles_horas_cloud.py'
      - 'src/fuente2_niveles.py'
      - 'src/lluvia_conagua_cloud.py'
      - 'src/procesar_niveles.js'
      - 'src/procesar_niveles_horas.js'
      - 'src/extraer_lluvia_conagua.js'
      - 'src/niveles_postprocess.py'
      - 'src/resumen_12h_niveles.py'
      - 'src/generar_word_niveles.py'
      - 'data/latest/FUENTE1.txt'
      - 'data/latest/FUENTE2.txt'
      - 'requirements.txt'
      - 'package.json'
      - '.github/workflows/niveles-cloud.yml'
  schedule:
    # Tabasco = UTC-6. Ejecutar cada hora de 06:30 a 18:30 hora local.
    # 06:30–17:30 local = 12:30–23:30 UTC.
    - cron: '30 12-23 * * *'
    # 18:30 local = 00:30 UTC del día siguiente.
    - cron: '30 0 * * *'

permissions:
  contents: write

concurrency:
  group: agente-hidrometeorologico-repo-writer
  cancel-in-progress: false

jobs:
  recolectar-niveles:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias Python
        run: pip install -r requirements.txt

      - name: Instalar dependencias Node
        run: npm install --no-audit --no-fund

      - name: Ejecutar niveles hidrométricos cloud
        env:
          CARBONIO_BASE: https://correo.tabasco.gob.mx
          CARBONIO_USER: ${{ secrets.CARBONIO_USER }}
          CARBONIO_PASSWORD: ${{ secrets.CARBONIO_PASSWORD }}
          CARBONIO_USER_FUENTE1: ${{ secrets.CARBONIO_USER_FUENTE1 }}
          CARBONIO_PASSWORD_FUENTE1: ${{ secrets.CARBONIO_PASSWORD_FUENTE1 }}
          NIVELES_BASE: data/niveles
        run: python src/niveles_cloud.py

      - name: Completar todas las horas publicadas del boletín hidrométrico
        env:
          CARBONIO_BASE: https://correo.tabasco.gob.mx
          CARBONIO_USER: ${{ secrets.CARBONIO_USER }}
          CARBONIO_PASSWORD: ${{ secrets.CARBONIO_PASSWORD }}
          CARBONIO_USER_FUENTE1: ${{ secrets.CARBONIO_USER_FUENTE1 }}
          CARBONIO_PASSWORD_FUENTE1: ${{ secrets.CARBONIO_PASSWORD_FUENTE1 }}
          NIVELES_BASE: data/niveles
        run: python src/niveles_horas_cloud.py

      - name: Incorporar corte FUENTE2 de las 08:00 a niveles vigentes
        run: python src/fuente2_niveles.py

      - name: Extraer lluvia horaria CONAGUA del reporte más reciente
        env:
          CARBONIO_BASE: https://correo.tabasco.gob.mx
          CARBONIO_USER: ${{ secrets.CARBONIO_USER }}
          CARBONIO_PASSWORD: ${{ secrets.CARBONIO_PASSWORD }}
          CARBONIO_USER_FUENTE1: ${{ secrets.CARBONIO_USER_FUENTE1 }}
          CARBONIO_PASSWORD_FUENTE1: ${{ secrets.CARBONIO_PASSWORD_FUENTE1 }}
          NIVELES_BASE: data/niveles
        run: python src/lluvia_conagua_cloud.py

      - name: Calcular ciclo 06:00 y generar gráficas PNG
        run: python src/niveles_postprocess.py

      - name: Generar resumen compacto últimas 12 h
        run: python src/resumen_12h_niveles.py

      - name: Generar y verificar Word de niveles
        run: python src/generar_word_niveles.py

      - name: Publicar niveles, lluvia CONAGUA, gráficas y Word
        shell: bash
        run: |
          git config user.name "Agente Hidrometeorologico Cloud"
          git config user.email "actions@users.noreply.github.com"
          git add data/niveles/Historico \
                  data/niveles/Resumen_12h \
                  data/niveles/Ultimo_Corte \
                  data/niveles/Estado \
                  data/niveles/Estado_Niveles_Cloud.json \
                  data/niveles/Lluvia_CONAGUA \
                  data/niveles/Graficas \
                  data/niveles/Reportes \
                  data/niveles/Evidencia_Texto
          if git diff --cached --quiet; then
            echo "Sin cambios de niveles/lluvia para publicar."
          else
            # Guardar sólo los productos generados; actualizar primero main para evitar
            # conflictos con cambios de la app realizados mientras corre el agente.
            git stash push --include-untracked -m "productos-niveles-cloud"
            git pull --rebase origin main
            git stash pop
            git add data/niveles/Historico \
                    data/niveles/Resumen_12h \
                    data/niveles/Ultimo_Corte \
                    data/niveles/Estado \
                    data/niveles/Estado_Niveles_Cloud.json \
                    data/niveles/Lluvia_CONAGUA \
                    data/niveles/Graficas \
                    data/niveles/Reportes \
                    data/niveles/Evidencia_Texto
            git commit -m "Actualiza niveles y lluvia CONAGUA [skip ci]"
            git push origin main
          fi

# El corte vigente también se refresca cuando llegan FUENTE1/FUENTE2,
# sin modificar la aplicación ni su estructura visual.