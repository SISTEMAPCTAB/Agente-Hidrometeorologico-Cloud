name: SIH CONAGUA Watchdog

on:
  workflow_dispatch:
  schedule:
    # Recuperación aislada 15 min después de cada ventana SIH.
    # Tabasco UTC-6: 09:45, 11:15, 14:15, 17:15 y 22:15.
    - cron: '45 15 * * *'
    - cron: '15 17 * * *'
    - cron: '15 20 * * *'
    - cron: '15 23 * * *'
    - cron: '15 5 * * *'
    # Refuerzo tras la actualización oficial diaria de SIH.
    - cron: '15 18 * * *'
    - cron: '45 18 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/sih-watchdog.yml'

permissions:
  contents: write

# Comparte exclusión con el flujo SIH principal: nunca escriben a la vez.
concurrency:
  group: sih-lluvia-conagua
  cancel-in-progress: false

jobs:
  recuperar-si-corresponde:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}

      - name: Determinar si falta una consulta SIH programada
        id: gate
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          tz=ZoneInfo('America/Mexico_City')
          now=datetime.now(tz)
          slots=[(9,30),(11,0),(14,0),(17,0),(22,0)]
          due=[now.replace(hour=h,minute=m,second=0,microsecond=0) for h,m in slots
               if now >= now.replace(hour=h,minute=m,second=0,microsecond=0)]
          target=max(due) if due else None

          last=None
          p=Path('data/sih_lluvia/Estado_SIH_Lluvia.json')
          if p.exists():
              try:
                  raw=json.loads(p.read_text(encoding='utf-8')).get('run_local')
                  if raw:
                      last=datetime.fromisoformat(raw)
                      if last.tzinfo is None:last=last.replace(tzinfo=tz)
                      else:last=last.astimezone(tz)
              except Exception:
                  pass

          source_date=None
          try:
              q=Path('data/sih_lluvia/latest.json')
              if q.exists():
                  source_date=json.loads(q.read_text(encoding='utf-8')).get('fecha_fuente')
          except Exception:
              pass
          stale_source=bool(now.hour>=12 and source_date!=now.date().isoformat())
          # Tras las 12:00, si la fuente sigue siendo de ayer, reintentar como máximo
          # una vez cada 25 minutos. Antes de las 12:00 conserva el criterio de slots.
          retry_due=bool(stale_source and (last is None or (now-last).total_seconds()>=25*60))
          needed=bool((target and (last is None or last < target)) or retry_due)
          print('SIH watchdog:', 'ahora=',now.isoformat(), 'objetivo=',target.isoformat() if target else None,
                'ultima_revision=',last.isoformat() if last else None, 'fecha_fuente=',source_date,
                'fuente_atrasada=',stale_source, 'ejecutar=',needed)
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              f.write(f"run={'true' if needed else 'false'}\n")
          PY

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependencias
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Consultar SIH
        if: steps.gate.outputs.run == 'true'
        run: python src/sih_lluvia_conagua.py

      - name: Validar resultado
        if: steps.gate.outputs.run == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('data/sih_lluvia/Estado_SIH_Lluvia.json').read_text(encoding='utf-8'))
          d=json.loads(Path('data/sih_lluvia/latest.json').read_text(encoding='utf-8'))
          assert not s.get('errors'), s
          assert d.get('fecha_fuente'), d
          assert len(d.get('estaciones_tabasco',[]))>0, d
          print('SIH validado:', d['fecha_fuente'], len(d['estaciones_tabasco']), 'estaciones Tabasco')
          PY

      - name: Publicar sólo productos SIH
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Agente Hidrometeorologico SIH Watchdog"
          git config user.email "actions@users.noreply.github.com"
          tar -cf /tmp/sih-watchdog.tar data/sih_lluvia
          for intento in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            tar -xf /tmp/sih-watchdog.tar
            git add data/sih_lluvia
            if git diff --cached --quiet; then
              echo "SIH ya estaba publicado."
              exit 0
            fi
            git commit -m "Recupera consulta SIH CONAGUA [skip ci]"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((intento*5))
          done
          exit 1
