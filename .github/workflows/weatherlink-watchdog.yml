name: WeatherLink Watchdog - recuperación automática

on:
  workflow_dispatch:
  schedule:
    # El flujo principal corre en :14/:29/:44/:59. El watchdog se desplaza
    # 8 minutos para no competir por el mismo grupo de concurrencia.
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: write

concurrency:
  # Comparte el mismo grupo del flujo principal para impedir ejecuciones simultáneas.
  group: weatherlink-cloud
  cancel-in-progress: false

jobs:
  verificar-y-recuperar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar antigüedad del último corte WeatherLink
        id: freshness
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          p = Path('data/weatherlink/Estado_WeatherLink_Cloud.json')
          recover = True
          reason = 'estado inexistente o inválido'
          age_minutes = None

          try:
              s = json.loads(p.read_text(encoding='utf-8'))
              run_utc = s.get('run_utc')
              complete = s.get('complete') is True
              expected = s.get('stations_expected')
              ok = s.get('stations_ok')
              errors = s.get('errors') or []
              if run_utc:
                  last = datetime.fromisoformat(run_utc.replace('Z', '+00:00'))
                  if last.tzinfo is None:
                      last = last.replace(tzinfo=timezone.utc)
                  age_minutes = (datetime.now(timezone.utc) - last.astimezone(timezone.utc)).total_seconds() / 60.0
                  healthy = complete and expected == ok and not errors
                  # Con un flujo principal cada 15 min, >35 min implica al menos
                  # dos ventanas consecutivas sin publicar un estado válido.
                  recover = (not healthy) or age_minutes > 35
                  reason = f"complete={complete}; estaciones={ok}/{expected}; errores={len(errors)}; antigüedad={age_minutes:.1f} min"
          except Exception as exc:
              reason = f"error leyendo estado: {exc}"

          print(f"WeatherLink: {reason}")
          print(f"Recuperación necesaria: {recover}")
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write(f"recover={'true' if recover else 'false'}\n")
              if age_minutes is not None:
                  fh.write(f"age_minutes={age_minutes:.1f}\n")
          PY

      - name: Estado vigente, no ejecutar respaldo
        if: steps.freshness.outputs.recover != 'true'
        run: echo "WeatherLink está vigente. El watchdog no duplica la recolección."

      - name: Configurar Python
        if: steps.freshness.outputs.recover == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias
        if: steps.freshness.outputs.recover == 'true'
        run: pip install -r requirements.txt

      - name: Resolver enlaces compartidos WeatherLink
        if: steps.freshness.outputs.recover == 'true'
        run: python src/weatherlink_resolve_shared.py

      - name: Ejecutar recuperación WeatherLink Cloud
        if: steps.freshness.outputs.recover == 'true'
        run: python src/weatherlink_cloud.py

      - name: Ejecutar recuperación WeatherLink adicional
        if: steps.freshness.outputs.recover == 'true'
        run: python src/weatherlink_extra_cloud.py

      - name: Actualizar resumen térmico diario
        if: steps.freshness.outputs.recover == 'true'
        run: python src/temperature_summary.py

      - name: Generar Word WeatherLink
        if: steps.freshness.outputs.recover == 'true'
        run: python src/generar_word_weatherlink.py

      - name: Verificar recuperación y Word
        if: steps.freshness.outputs.recover == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          estado = json.loads(Path('data/weatherlink/Estado_WeatherLink_Cloud.json').read_text(encoding='utf-8'))
          assert estado.get('complete') is True, 'La recuperación WeatherLink no quedó completa'
          assert estado.get('stations_ok') == estado.get('stations_expected'), 'No se recuperaron todas las estaciones esperadas'
          assert not estado.get('errors'), 'La recuperación WeatherLink reportó errores'

          word = json.loads(Path('data/weatherlink/Reportes/Estado_Word.json').read_text(encoding='utf-8'))
          assert word.get('verified') is True, 'Word no verificado'
          assert word.get('docx_structure_verified') is True, 'Estructura DOCX no verificada'
          assert word.get('download_url', '').endswith('?raw=1'), 'Falta URL de descarga directa'
          print('Recuperación WeatherLink verificada:', estado.get('run_local'))
          PY

      - name: Publicar recuperación WeatherLink
        if: steps.freshness.outputs.recover == 'true'
        shell: bash
        run: |
          set -e
          git config user.name "Agente Hidrometeorologico Cloud"
          git config user.email "actions@users.noreply.github.com"
          git add data/weatherlink/state.json \
                  data/weatherlink/latest.json \
                  data/weatherlink/extra_state.json \
                  data/weatherlink/extra_latest.json \
                  data/weatherlink/shared_resolved.json \
                  data/weatherlink/Tabla_WeatherLink_Cloud.csv \
                  data/weatherlink/Estado_WeatherLink_Cloud.json \
                  data/weatherlink/temperature_state.json \
                  data/weatherlink/temperature_summary.json \
                  data/weatherlink/Reportes

          if git diff --cached --quiet; then
            echo "La recuperación no produjo cambios para publicar."
            exit 0
          fi

          tar -cf /tmp/weatherlink-watchdog.tar data/weatherlink
          git reset --hard HEAD
          for intento in 1 2 3 4; do
            echo "Intento de publicación de recuperación ${intento}/4"
            git fetch origin main
            git reset --hard origin/main
            tar -xf /tmp/weatherlink-watchdog.tar
            git add data/weatherlink
            git diff --cached --quiet && exit 0
            git commit -m "Recupera WeatherLink automáticamente [skip ci]"
            if git push origin HEAD:main; then
              echo "Recuperación WeatherLink publicada."
              exit 0
            fi
            sleep $((intento * 8))
          done
          echo "No fue posible publicar la recuperación WeatherLink después de 4 intentos."
          exit 1
