name: WeatherLink Cloud - 32 estaciones

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/weatherlink_cloud.py'
      - 'src/weatherlink_extra_cloud.py'
      - 'src/weatherlink_resolve_shared.py'
      - 'src/temperature_summary.py'
      - 'src/generar_word_weatherlink.py'
      - 'config/weatherlink_stations.json'
      - 'config/weatherlink_stations_extra.json'
      - 'data/weatherlink/seed.csv'
      - 'data/weatherlink/seed_daily.json'
      - 'data/fuentes_publicas/**'
      - 'data/niveles/**'
      - 'data/carbonio/**'
      - 'requirements.txt'
      - '.gitattributes'
      - '.github/workflows/weatherlink-cloud.yml'
      - '.github/workflows/weatherlink-watchdog.yml'
  schedule:
    # Cada 15 minutos, desplazado de :00/:15/:30/:45 para reducir retrasos
    # de GitHub Actions y disminuir el rezago frente al mapa público WeatherLink.
    - cron: '14,29,44,59 * * * *'

permissions:
  contents: write

concurrency:
  group: weatherlink-cloud
  cancel-in-progress: false

jobs:
  recolectar-weatherlink:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Resolver enlaces compartidos WeatherLink
        run: python src/weatherlink_resolve_shared.py

      - name: Ejecutar WeatherLink Cloud
        run: python src/weatherlink_cloud.py

      - name: Ejecutar WeatherLink adicional
        run: python src/weatherlink_extra_cloud.py

      - name: Actualizar resumen térmico diario
        run: python src/temperature_summary.py

      - name: Verificar recolección WeatherLink antes de generar productos
        shell: bash
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          p=Path('data/weatherlink/Estado_WeatherLink_Cloud.json')
          s=json.loads(p.read_text(encoding='utf-8'))
          assert s.get('complete') is True, 'WeatherLink no quedó completo'
          assert s.get('stations_ok') == s.get('stations_expected'), 'No se recolectaron todas las estaciones esperadas'
          assert not (s.get('errors') or []), 'WeatherLink reportó errores'
          run=s.get('run_utc')
          assert run, 'Falta hora de ejecución WeatherLink'
          d=datetime.fromisoformat(run.replace('Z','+00:00'))
          if d.tzinfo is None: d=d.replace(tzinfo=timezone.utc)
          age=(datetime.now(timezone.utc)-d.astimezone(timezone.utc)).total_seconds()/60
          assert age < 20, f'El estado generado ya es antiguo: {age:.1f} min'
          print(f"WeatherLink verificado: {s.get('stations_ok')}/{s.get('stations_expected')}; antigüedad {age:.1f} min")
          PY

      - name: Generar y verificar Word WeatherLink
        run: python src/generar_word_weatherlink.py

      - name: Verificar entrega Word para PC y celular
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('data/weatherlink/Reportes/Estado_Word.json')
          s = json.loads(p.read_text(encoding='utf-8'))
          assert s.get('verified') is True, 'Word no verificado'
          assert s.get('docx_structure_verified') is True, 'Estructura DOCX no verificada'
          assert s.get('download_url', '').endswith('?raw=1'), 'Falta URL de descarga directa'
          print('Word WeatherLink verificado y listo para descarga directa:', s['download_url'])
          PY

      - name: Publicar estado, tabla, temperatura y Word WeatherLink
        shell: bash
        run: |
          set -e
          git config user.name "Agente Hidrometeorologico Cloud"
          git config user.email "actions@users.noreply.github.com"
          git add data/weatherlink/state.json \
                  data/weatherlink/latest.json \
                  data/weatherlink/extra_state.json \
                  data/weatherlink/extra_latest.json \
                  data/weatherlink/shared_resolved.json \
                  data/weatherlink/Tabla_WeatherLink_Cloud.csv \
                  data/weatherlink/Estado_WeatherLink_Cloud.json \
                  data/weatherlink/temperature_state.json \
                  data/weatherlink/temperature_summary.json \
                  data/weatherlink/Reportes
          if git diff --cached --quiet; then
            echo "Sin cambios WeatherLink para publicar."
            exit 0
          fi

          git commit -m "Actualiza WeatherLink cloud, temperatura y Word [skip ci]"

          for intento in 1 2 3; do
            echo "Intento de publicación ${intento}/3"
            if git pull --rebase origin main && git push origin main; then
              echo "Publicación WeatherLink completada."
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((intento * 10))
          done

          echo "No fue posible publicar WeatherLink después de 3 intentos."
          exit 1
