name: WeatherLink Cloud - 32 estaciones

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/weatherlink_cloud.py'
      - 'src/generar_word_weatherlink.py'
      - 'config/weatherlink_stations.json'
      - 'data/weatherlink/seed.csv'
      - 'data/weatherlink/seed_daily.json'
      - 'requirements.txt'
      - '.github/workflows/weatherlink-cloud.yml'
  schedule:
    # Cada 30 minutos, separado de los horarios Carbonio.
    # America/Mexico_City = UTC-6 durante 2026.
    - cron: '23,53 * * * *'

permissions:
  contents: write

jobs:
  recolectar-weatherlink:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: weatherlink-cloud-collector
      cancel-in-progress: false

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar WeatherLink Cloud
        run: python src/weatherlink_cloud.py

      - name: Generar y verificar Word WeatherLink
        run: python src/generar_word_weatherlink.py

      - name: Publicar estado, tabla y Word WeatherLink
        shell: bash
        run: |
          git config user.name "Agente Hidrometeorologico Cloud"
          git config user.email "actions@users.noreply.github.com"
          git add data/weatherlink/state.json \
                  data/weatherlink/latest.json \
                  data/weatherlink/Tabla_WeatherLink_Cloud.csv \
                  data/weatherlink/Estado_WeatherLink_Cloud.json \
                  data/weatherlink/Reportes
          if git diff --cached --quiet; then
            echo "Sin cambios WeatherLink para publicar."
          else
            git commit -m "Actualiza WeatherLink cloud y Word [skip ci]"
            git push
          fi
