name: WeatherLink Rescue - independiente

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Grupo propio: no queda bloqueado si weatherlink-cloud se atasca.
  group: weatherlink-rescue-independent
  cancel-in-progress: false

jobs:
  rescatar-si-rezagado:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar antigüedad del corte WeatherLink
        id: stale
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          p=Path('data/weatherlink/Estado_WeatherLink_Cloud.json')
          stale=True
          age=9999.0
          healthy=False
          try:
              s=json.loads(p.read_text(encoding='utf-8'))
              run=s.get('run_utc')
              healthy=(s.get('complete') is True and
                       s.get('stations_ok') == s.get('stations_expected') and
                       not (s.get('errors') or []))
              if run:
                  d=datetime.fromisoformat(run.replace('Z','+00:00'))
                  if d.tzinfo is None: d=d.replace(tzinfo=timezone.utc)
                  age=(datetime.now(timezone.utc)-d.astimezone(timezone.utc)).total_seconds()/60
                  stale=(not healthy) or age>20
          except Exception as exc:
              print('Estado WeatherLink inválido:', exc)
          # El conjunto adicional también forma parte de WeatherLink y debe
          # recuperarse aunque las 32 estaciones principales estén vigentes.
          extra=Path('data/weatherlink/extra_latest.json')
          extra_age=9999.0
          try:
              e=json.loads(extra.read_text(encoding='utf-8'))
              ed=datetime.fromisoformat(e['run_utc'].replace('Z','+00:00'))
              extra_age=(datetime.now(timezone.utc)-ed.astimezone(timezone.utc)).total_seconds()/60
          except (OSError, ValueError, KeyError, TypeError) as exc:
              print('WeatherLink adicional inválido:',exc)
          stale=stale or extra_age>20
          print(f'WeatherLink healthy={healthy}; age={age:.1f} min; adicional={extra_age:.1f} min; rescue={stale}')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as fh:
              fh.write(f"rescue={'true' if stale else 'false'}\n")
          PY

      - name: Estado vigente
        if: steps.stale.outputs.rescue != 'true'
        run: echo "WeatherLink vigente; respaldo no duplica la recolección."

      - name: Configurar Python
        if: steps.stale.outputs.rescue == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencia mínima
        if: steps.stale.outputs.rescue == 'true'
        run: pip install -r requirements.txt

      - name: Resolver enlaces compartidos WeatherLink
        if: steps.stale.outputs.rescue == 'true'
        run: python src/weatherlink_resolve_shared.py

      - name: Recuperar WeatherLink
        if: steps.stale.outputs.rescue == 'true'
        run: python src/weatherlink_cloud.py

      - name: Recuperar WeatherLink adicional
        if: steps.stale.outputs.rescue == 'true'
        run: python src/weatherlink_extra_cloud.py

      - name: Verificar recuperación
        if: steps.stale.outputs.rescue == 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          s=json.loads(Path('data/weatherlink/Estado_WeatherLink_Cloud.json').read_text(encoding='utf-8'))
          assert s.get('complete') is True
          assert s.get('stations_ok') == s.get('stations_expected')
          assert not (s.get('errors') or [])
          d=datetime.fromisoformat(s['run_utc'].replace('Z','+00:00'))
          if d.tzinfo is None:d=d.replace(tzinfo=timezone.utc)
          age=(datetime.now(timezone.utc)-d.astimezone(timezone.utc)).total_seconds()/60
          assert age < 10, f'Corte recuperado antiguo: {age:.1f} min'
          extra=json.loads(Path('data/weatherlink/extra_latest.json').read_text(encoding='utf-8'))
          ed=datetime.fromisoformat(extra['run_utc'].replace('Z','+00:00')).astimezone(timezone.utc)
          assert (datetime.now(timezone.utc)-ed).total_seconds()/60 < 10, 'WeatherLink adicional no actualizado'
          print('WeatherLink recuperado:',s.get('run_local'),s.get('stations_ok'),'estaciones; adicional:',extra['run_utc'])
          PY

      - name: Publicar recuperación
        if: steps.stale.outputs.rescue == 'true'
        shell: bash
        run: |
          set -e
          git config user.name "WeatherLink Rescue"
          git config user.email "actions@users.noreply.github.com"
          git add data/weatherlink/state.json \
                  data/weatherlink/latest.json \
                  data/weatherlink/Tabla_WeatherLink_Cloud.csv \
                  data/weatherlink/Estado_WeatherLink_Cloud.json \
                  data/weatherlink/extra_state.json \
                  data/weatherlink/extra_latest.json \
                  data/weatherlink/shared_resolved.json
          if git diff --cached --quiet; then
            echo "Sin cambios para publicar."
            exit 0
          fi
          # Conservar sólo productos validados; comparar corte remoto antes de publicar.
          tar -cf /tmp/weatherlink-rescue.tar data/weatherlink/state.json data/weatherlink/latest.json data/weatherlink/Tabla_WeatherLink_Cloud.csv data/weatherlink/Estado_WeatherLink_Cloud.json data/weatherlink/extra_state.json data/weatherlink/extra_latest.json data/weatherlink/shared_resolved.json
          for intento in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            if python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          def timestamp(path):
              try:
                  d=json.loads(Path(path).read_text(encoding='utf-8'))
                  return datetime.fromisoformat(d['run_utc'].replace('Z','+00:00')).astimezone(timezone.utc)
              except (OSError, ValueError, KeyError, TypeError): return None
          import tarfile
          with tarfile.open('/tmp/weatherlink-rescue.tar') as t:
              candidate=json.load(t.extractfile('data/weatherlink/Estado_WeatherLink_Cloud.json'))
          proposed=datetime.fromisoformat(candidate['run_utc'].replace('Z','+00:00')).astimezone(timezone.utc)
          with tarfile.open('/tmp/weatherlink-rescue.tar') as t:
              extra=json.load(t.extractfile('data/weatherlink/extra_latest.json'))
          proposed_extra=datetime.fromisoformat(extra['run_utc'].replace('Z','+00:00')).astimezone(timezone.utc)
          current=timestamp('data/weatherlink/Estado_WeatherLink_Cloud.json')
          current_extra=timestamp('data/weatherlink/extra_latest.json')
          print('Principal candidato/remoto:',proposed,current,'Adicional candidato/remoto:',proposed_extra,current_extra)
          raise SystemExit(0 if current is not None and current_extra is not None and current>=proposed and current_extra>=proposed_extra else 1)
          PY
            then
              echo "El remoto ya tiene corte igual o posterior; no retroceder."
              exit 0
            fi
            tar -xf /tmp/weatherlink-rescue.tar
            git add data/weatherlink/state.json data/weatherlink/latest.json data/weatherlink/Tabla_WeatherLink_Cloud.csv data/weatherlink/Estado_WeatherLink_Cloud.json data/weatherlink/extra_state.json data/weatherlink/extra_latest.json data/weatherlink/shared_resolved.json
            git commit -m "Rescate independiente WeatherLink [skip ci]"
            if git push origin HEAD:main; then
              echo "Rescate WeatherLink publicado."
              exit 0
            fi
            sleep $((intento * 8))
          done
          exit 1
