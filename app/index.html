<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#7a1230" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Monitoreo Hidrometeorológico | IPCET</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand brand-institutional">
        <img src="logo-ipcet.svg" alt="Protección Civil Tabasco" class="brand-logo" />
        <div class="brand-copy">
          <strong>Monitoreo Hidrometeorológico</strong>
          <span>Dirección Operativa y de Apoyo a la Población</span>
          <small>Instituto de Protección Civil del Estado de Tabasco</small>
        </div>
      </div>
      <nav id="nav" class="nav"></nav>
      <div class="sidebar-foot"><span id="cloudState">Sin verificar</span></div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button id="menuBtn" class="icon-btn" aria-label="Abrir menú">☰</button>
        <div class="topbar-brand">
          <img src="logo-ipcet.svg" alt="Protección Civil Tabasco" class="topbar-logo" />
          <div>
            <div class="directorate">Dirección Operativa y de Apoyo a la Población</div>
            <h1 id="pageTitle">Resumen operativo</h1>
            <p id="pageSubtitle">Monitoreo hidrometeorológico Grijalva–Usumacinta · datos integrados desde GitHub Cloud</p>
          </div>
        </div>
        <div class="top-actions"><button id="refreshBtn" class="btn">Actualizar</button></div>
      </header>

      <section class="status-strip" id="statusStrip"></section>
      <section id="content" class="content"></section>
    </main>
  </div>

  <template id="loadingTemplate"><div class="panel"><div class="skeleton"></div><div class="skeleton short"></div><div class="skeleton"></div></div></template>
  <script src="app.js" defer></script>
  <script src="rain-colors.js" defer></script>
  <script src="fuentes-live.js" defer></script>
  <script src="live.js" defer></script>
</body>
</html>
