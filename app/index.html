<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#17324d" />
  <title>Monitoreo Hidrometeorológico</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">MH</div>
        <div><strong>Monitoreo Hidrometeorológico</strong><span>Grijalva–Usumacinta</span></div>
      </div>
      <nav id="nav" class="nav"></nav>
      <div class="sidebar-foot"><span id="cloudState">Sin verificar</span></div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button id="menuBtn" class="icon-btn" aria-label="Abrir menú">☰</button>
        <div><h1 id="pageTitle">Resumen operativo</h1><p id="pageSubtitle">Datos integrados desde GitHub Cloud</p></div>
        <div class="top-actions"><button id="refreshBtn" class="btn">Actualizar</button></div>
      </header>

      <section class="status-strip" id="statusStrip"></section>
      <section id="content" class="content"></section>
    </main>
  </div>

  <template id="loadingTemplate"><div class="panel"><div class="skeleton"></div><div class="skeleton short"></div><div class="skeleton"></div></div></template>
  <script src="app.js" defer></script>
</body>
</html>
